<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#384959">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Quick Tap">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon-180.png">
  <link rel="apple-touch-icon" sizes="167x167" href="assets/icons/apple-touch-icon-167.png">
  <link rel="apple-touch-icon" sizes="152x152" href="assets/icons/apple-touch-icon-152.png">
  <title>Quick Tap</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #111318;
      color: #f7f8fa;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-tap-highlight-color: transparent;
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; }
    body { min-height: 100dvh; background: #111318; touch-action: manipulation; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-font-smoothing: antialiased; }
    button, input, select { font: inherit; }
    button { color: inherit; touch-action: manipulation; }
    [hidden] { display: none !important; }

    .screen { position: absolute; inset: 0; min-height: 100dvh; }
    .screen:not(.active) { display: none; }

    .topbar {
      position: absolute;
      z-index: 8;
      top: calc(env(safe-area-inset-top) + 16px);
      left: 16px;
      right: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      pointer-events: none;
    }

    .topbar > * { min-width: 0; pointer-events: auto; }
    .icon-button, .pill {
      min-height: 42px;
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 999px;
      background: rgba(17,19,24,.76);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: #fff;
    }
    .icon-button { padding: 0 15px; cursor: pointer; font-size: .82rem; font-weight: 850; white-space: nowrap; transition: border-color 150ms ease, background 150ms ease, transform 100ms ease; }
    .pill { display: flex; align-items: baseline; gap: 7px; padding: 9px 13px; }
    .pill__label { color: rgba(255,255,255,.68); font-size: .66rem; font-weight: 850; letter-spacing: .06em; }
    .pill__value { font-size: 1.02rem; font-weight: 850; font-variant-numeric: tabular-nums; }
    .score-group { display: flex; min-width: 0; gap: 7px; }
    .topbar__actions { display: flex; min-width: 0; align-items: center; gap: 7px; }
    .button-label--short { display: none; }
    .study-toggle[aria-pressed="true"] {
      border-color: rgba(123,240,191,.62);
      background: rgba(26,91,72,.9);
      color: #a9f8d7;
    }
    .game.study-mode .game-timer { display: none; }

    .welcome, .menu {
      display: grid;
      place-items: center;
      padding: calc(env(safe-area-inset-top) + 26px) 22px calc(env(safe-area-inset-bottom) + 26px);
      overflow-y: auto;
      background:
        radial-gradient(circle at 18% 18%, rgba(75,205,168,.13), transparent 34%),
        radial-gradient(circle at 86% 78%, rgba(168,120,255,.12), transparent 34%),
        #111318;
    }

    .panel { width: min(100%, 520px); min-width: 0; }
    .menu .panel { width: min(100%, 1080px); min-width: 0; }
    .welcome__back {
      width: auto;
      margin: 0 0 24px;
      border-color: rgba(255,255,255,.16);
      background: #22262e;
    }
    .brand { margin: 0 0 10px; color: #7bf0bf; font-size: .74rem; font-weight: 900; letter-spacing: .17em; }
    .welcome h1 { margin: 0; font-size: clamp(2.1rem, 9vw, 3.7rem); line-height: 1.04; letter-spacing: -.055em; }
    .subtitle { margin: 14px 0 28px; color: rgba(255,255,255,.7); line-height: 1.58; }
    .field-label { display: block; margin: 0 0 9px; color: rgba(255,255,255,.72); font-size: .82rem; font-weight: 800; }
    .select, .text-input {
      width: 100%;
      height: 56px;
      padding: 0 16px;
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 16px;
      outline: 0;
      background: #1b1e25;
      color: #fff;
    }
    .select:focus, .text-input:focus { border-color: #7bf0bf; box-shadow: 0 0 0 3px rgba(123,240,191,.12); }
    .text-input { margin-top: 10px; user-select: text; -webkit-user-select: text; }
    .study-option {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-top: 14px;
      padding: 15px 16px;
      border: 1px solid rgba(123,240,191,.25);
      border-radius: 16px;
      background: rgba(34,76,64,.34);
      cursor: pointer;
    }
    .study-option input { flex: 0 0 auto; width: 21px; height: 21px; margin: 2px 0 0; accent-color: #7bf0bf; }
    .study-option strong { display: block; color: #a9f8d7; font-size: .94rem; }
    .study-option span { display: block; margin-top: 4px; color: rgba(255,255,255,.72); font-size: .8rem; line-height: 1.45; }
    .primary-button, .secondary-button, .danger-button {
      width: 100%;
      min-height: 54px;
      border: 0;
      border-radius: 16px;
      cursor: pointer;
      font-weight: 850;
    }
    .primary-button { margin-top: 16px; background: #f3f5f7; color: #111318; }
    .secondary-button { border: 1px solid rgba(255,255,255,.14); background: #262a32; color: #fff; }
    .danger-button { border: 1px solid rgba(255,105,120,.27); background: rgba(255,73,91,.1); color: #ff9ba5; }
    .primary-button, .secondary-button, .danger-button { transition: filter 150ms ease, border-color 150ms ease, transform 100ms ease; }
    .primary-button:active, .secondary-button:active, .icon-button:active, .activity-card:active { transform: scale(.975); }
    button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid #7bf0bf; outline-offset: 3px; }

    .activity-chip { display: inline-flex; margin-bottom: 18px; padding: 9px 13px; border-radius: 999px; background: #22262e; color: #7bf0bf; font-size: clamp(.78rem, 1.45vmin, 1rem); font-weight: 850; }
    .activity-list { display: grid; min-width: 0; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
    .activity-card {
      position: relative;
      width: 100%;
      min-width: 0;
      min-height: 170px;
      overflow: hidden;
      padding: 22px 50px 22px 22px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 24px;
      text-align: left;
      cursor: pointer;
      transition: filter 160ms ease, border-color 160ms ease, transform 120ms ease, box-shadow 160ms ease;
    }
    .activity-card::after { content: "→"; position: absolute; right: 19px; bottom: 17px; color: rgba(255,255,255,.55); font-size: 1.25rem; font-weight: 900; transition: transform 160ms ease, color 160ms ease; }
    .activity-card--prime { background: linear-gradient(155deg, #226c5e, #163d36); }
    .activity-card--grammar { background: linear-gradient(155deg, #7250a5, #3d2d58); }
    .activity-card--ing { background: linear-gradient(155deg, #a45848, #55312c); }
    .activity-card--sentence-error { background: linear-gradient(155deg, #3d6f91, #243c59); }
    .activity-card:disabled { cursor: not-allowed; filter: grayscale(.65) brightness(.72); }
    .activity-card__icon { display: block; margin-bottom: 28px; color: rgba(255,255,255,.96); font-size: clamp(2rem, 4vmin, 3rem); font-weight: 500; letter-spacing: -.04em; }
    .activity-card strong { display: block; font-size: clamp(1.35rem, 2.8vmin, 2rem); letter-spacing: -.03em; }

    .game { overflow: hidden; }
    .choice { position: absolute; border: 0; cursor: pointer; transition: filter 100ms ease, box-shadow 120ms ease; }
    .choice:active { filter: brightness(1.17); }
    .choice__label { font-weight: 850; letter-spacing: -.02em; text-align: center; }
    .choice__hint { display: block; margin-top: 7px; color: rgba(255,255,255,.7); font-size: clamp(.68rem, 1.45vmin, 1rem); font-weight: 800; letter-spacing: .08em; }

    .prime-choice { left: 0; width: 100%; height: 50%; color: rgba(255,255,255,.92); }
    .prime-choice--yes { top: 0; padding-top: 100px; background: linear-gradient(160deg, #226c5e, #17483f); }
    .prime-choice--no { bottom: 0; padding-bottom: 72px; background: linear-gradient(160deg, #473346, #2d222e); }
    .prime-choice--yes .choice__label { position: absolute; top: calc(env(safe-area-inset-top) + 142px); left: 0; width: 100%; }
    .prime-choice--no .choice__label {
      position: absolute;
      bottom: calc(env(safe-area-inset-bottom) + 38px);
      left: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }
    .prime-choice--no .choice__hint { order: -1; margin: 0 0 7px; }
    .prime-choice .choice__label { font-size: clamp(1.08rem, calc(2.4vmin + .5rem), 2.25rem); }
    .prime-divider { position: absolute; z-index: 2; top: 50%; left: 7%; width: 86%; height: 1px; background: rgba(255,255,255,.14); pointer-events: none; }

    .ing-choice { left: 0; width: 100%; height: 50%; color: rgba(255,255,255,.92); }
    .ing-choice--gerund { top: 0; background: linear-gradient(160deg, #9b5747, #63372f); }
    .ing-choice--participle { bottom: 0; background: linear-gradient(160deg, #315e76, #263f57); }
    .ing-choice--gerund .choice__label { position: absolute; top: calc(env(safe-area-inset-top) + 142px); left: 0; width: 100%; }
    .ing-choice--participle .choice__label {
      position: absolute;
      bottom: calc(env(safe-area-inset-bottom) + 38px);
      left: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }
    .ing-choice--participle .choice__hint { order: -1; margin: 0 0 7px; }
    .ing-choice .choice__label { font-size: clamp(1.08rem, calc(2.4vmin + .5rem), 2.25rem); }
    .sentence-error-choice { left: 0; width: 100%; height: 50%; color: rgba(255,255,255,.94); }
    .sentence-error-choice--incorrect { top: 0; background: linear-gradient(160deg, #824657, #4d2c39); }
    .sentence-error-choice--correct { bottom: 0; background: linear-gradient(160deg, #226c5e, #17483f); }
    .sentence-error-stage {
      position: absolute;
      z-index: 19;
      top: 50%;
      left: 50%;
      display: grid;
      justify-items: center;
      width: min(88vw, 980px);
      pointer-events: none;
      transform: translate(-50%, -50%);
    }
    .sentence-error-guides {
      position: absolute;
      z-index: 18;
      inset: 0;
      pointer-events: none;
    }
    .sentence-error-guide {
      position: absolute;
      left: 50%;
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      color: #fff;
      font-size: clamp(.92rem, 2vmin, 1.15rem);
      font-weight: 850;
      letter-spacing: -.02em;
      white-space: nowrap;
    }
    .sentence-error-guide::before,
    .sentence-error-guide::after {
      font-size: .82em;
      font-weight: 900;
      line-height: 1;
    }
    .sentence-error-guide__incorrect::after { content: "↑"; }
    .sentence-error-guide__correct::before { content: "↓"; }
    .sentence-error-guide__incorrect {
      top: calc(env(safe-area-inset-top) + 142px);
      transform: translateX(-50%);
    }
    .sentence-error-guide__correct {
      bottom: calc(env(safe-area-inset-bottom) + 38px);
      transform: translateX(-50%);
    }
    .sentence-error-divider { position: absolute; z-index: 2; top: 50%; left: 7%; width: 86%; height: 1px; background: rgba(255,255,255,.16); pointer-events: none; }
    .ing-sentence {
      width: min(88vw, 920px);
      min-width: 0;
      max-height: min(38dvh, 330px);
      overflow: hidden;
      padding: clamp(22px, 4vmin, 38px) clamp(24px, 5vw, 60px);
      font-family: "Avenir Next", "Trebuchet MS", Arial, sans-serif;
      font-size: clamp(1.55rem, calc(3.25vmin + .55rem), 3.35rem);
      font-weight: 700;
      line-height: 1.4;
      letter-spacing: -.025em;
      text-wrap: balance;
    }
    .sentence-error-stage .sentence-error-card {
      position: relative;
      top: auto;
      left: auto;
      width: 100%;
      min-width: 0;
      max-height: min(48dvh, 460px);
      overflow: hidden;
      padding: clamp(24px, 4.5vmin, 44px) clamp(22px, 5vw, 64px);
      font-family: "Avenir Next", "Trebuchet MS", Arial, sans-serif;
      font-size: clamp(2.15rem, calc(4.5vmin + .75rem), 5.2rem);
      font-weight: 750;
      line-height: 1.28;
      letter-spacing: -.025em;
      overflow-wrap: anywhere;
      text-wrap: balance;
      transform: none;
    }
    .sentence-error-stage .sentence-error-card.pop { animation: sentence-error-pop 170ms ease-out; }
    @keyframes sentence-error-pop {
      0% { opacity: .25; transform: scale(.9); }
      100% { opacity: 1; transform: scale(1); }
    }
    .sentence-error-empty {
      position: absolute;
      z-index: 22;
      inset: 0;
      display: grid;
      place-content: center;
      gap: 16px;
      padding: 30px;
      background: #111318;
      text-align: center;
    }
    .sentence-error-empty p { margin: 0; font-size: clamp(1.2rem, 3vmin, 1.7rem); font-weight: 800; }
    .sentence-error-empty .secondary-button { width: auto; padding-inline: 24px; }
    .marked-ing {
      color: #fff1a8;
      font-weight: 950;
      text-decoration-line: underline;
      text-decoration-thickness: .13em;
      text-underline-offset: .24em;
      text-decoration-color: #ffcb5c;
      text-decoration-skip-ink: none;
    }

    .game-timer {
      position: absolute;
      z-index: 9;
      top: calc(env(safe-area-inset-top) + 72px);
      left: 50%;
      width: min(48vw, 360px);
      transform: translateX(-50%);
      pointer-events: none;
    }
    .game-timer__meta { display: flex; justify-content: space-between; margin-bottom: 6px; color: rgba(255,255,255,.72); font-size: clamp(.67rem, 1.35vmin, .88rem); font-weight: 850; }
    .game-timer__track { height: clamp(7px, 1vmin, 11px); overflow: hidden; border: 1px solid rgba(255,255,255,.16); border-radius: 999px; background: rgba(17,19,24,.54); }
    .game-timer__bar { display: block; width: 100%; height: 100%; border-radius: inherit; background: #7bf0bf; transform-origin: left center; }
    .game-timer.urgent .game-timer__bar { background: #ff6575; }

    .center-card {
      position: absolute;
      z-index: 19;
      top: 50%;
      left: 50%;
      min-width: min(56vw, 230px);
      padding: 18px 28px 20px;
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 24px;
      background: rgba(17,19,24,.94);
      box-shadow: 0 18px 50px rgba(0,0,0,.35);
      transform: translate(-50%,-50%);
      text-align: center;
      pointer-events: none;
    }
    .number { font-size: clamp(4.5rem, 24vw, 7.5rem); font-weight: 850; line-height: .9; letter-spacing: -.07em; font-variant-numeric: tabular-nums; }
    .verb { min-width: min(62vw, 300px); padding-block: 22px 24px; font-size: clamp(2.4rem, 12vw, 4.6rem); font-weight: 850; line-height: 1; letter-spacing: -.055em; }
    .center-card.pop { animation: pop 170ms ease-out; }
    @keyframes pop { 0% { opacity: .25; transform: translate(-50%,-50%) scale(.83); } 100% { opacity: 1; transform: translate(-50%,-50%) scale(1); } }

    .grammar-grid { position: absolute; inset: 0; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
    .grammar-choice { position: relative; width: 100%; height: 100%; padding: 140px 12px 40px; color: rgba(255,255,255,.9); }
    .grammar-choice:nth-child(1) { background: #205f55; }
    .grammar-choice:nth-child(2) { background: #4e3d70; }
    .grammar-choice:nth-child(3) { padding-top: 70px; background: #644530; }
    .grammar-choice:nth-child(4) { padding-top: 70px; background: #3a526d; }
    .grammar-choice .choice__label { display: block; margin: auto; max-width: clamp(180px, 30vw, 350px); font-size: clamp(1.08rem, calc(2.4vmin + .55rem), 2.3rem); line-height: 1.22; }
    .choice-key {
      position: absolute;
      z-index: 3;
      display: grid;
      place-items: center;
      width: clamp(42px, 6.2vmin, 58px);
      aspect-ratio: 1;
      border: 2px solid rgba(255,255,255,.4);
      border-radius: 14px;
      background: rgba(17,19,24,.72);
      box-shadow: 0 8px 20px rgba(0,0,0,.22);
      color: #fff;
      font-family: inherit;
      font-size: clamp(1.2rem, 3vmin, 1.75rem);
      font-weight: 900;
      line-height: 1;
    }
    .grammar-choice:nth-child(1) .choice-key, .grammar-choice:nth-child(2) .choice-key { top: calc(env(safe-area-inset-top) + 76px); }
    .grammar-choice:nth-child(3) .choice-key, .grammar-choice:nth-child(4) .choice-key {
      top: auto;
      bottom: calc(env(safe-area-inset-bottom) + 18px);
    }
    .grammar-choice:nth-child(odd) .choice-key { left: 18px; }
    .grammar-choice:nth-child(even) .choice-key { right: 18px; }
    .grammar-lines::before, .grammar-lines::after { content: ""; position: absolute; z-index: 2; background: rgba(255,255,255,.16); pointer-events: none; }
    .grammar-lines::before { top: 7%; bottom: 7%; left: 50%; width: 1px; }
    .grammar-lines::after { top: 50%; left: 5%; right: 5%; height: 1px; }

    .flash { position: absolute; z-index: 12; inset: 0; opacity: 0; pointer-events: none; }
    .flash.correct { animation: correct 240ms ease-out; }
    .flash.wrong { animation: wrong 340ms ease-out; }
    @keyframes correct { 0% { opacity: .55; box-shadow: inset 0 0 0 8px #BDDDFC; } 100% { opacity: 0; box-shadow: inset 0 0 0 0 #BDDDFC; } }
    @keyframes wrong { 0%,45% { opacity: .65; background: rgba(255,73,91,.48); } 100% { opacity: 0; } }

    .choice.answer-correct { z-index: 4; filter: brightness(1.24); box-shadow: inset 0 0 0 clamp(6px, .9vmin, 11px) #8affcf; }
    .choice.answer-wrong { z-index: 4; filter: brightness(.8); box-shadow: inset 0 0 0 clamp(6px, .9vmin, 11px) #ff5264; }
    .answer-feedback {
      position: absolute;
      z-index: 20;
      top: calc(50% - clamp(112px, 14vmin, 160px));
      left: 50%;
      min-width: min(68vw, 400px);
      padding: clamp(13px, 2vmin, 20px) clamp(22px, 3.5vmin, 36px);
      border: 3px solid transparent;
      border-radius: 24px;
      box-shadow: 0 18px 60px rgba(0,0,0,.45);
      opacity: 0;
      transform: translate(-50%,-50%) scale(.78);
      text-align: center;
      pointer-events: none;
    }
    .answer-feedback.show { animation: feedback-pop 650ms ease-out both; }
    .answer-feedback.correct { border-color: #8affcf; background: rgba(14,77,58,.97); color: #dffff2; }
    .answer-feedback.wrong { border-color: #ff6575; background: rgba(110,23,35,.97); color: #fff0f2; }
    .answer-feedback strong { display: block; font-size: clamp(1.45rem, 3.8vmin, 2.35rem); line-height: 1.05; }
    .answer-feedback span { display: block; margin-top: 7px; font-size: clamp(.78rem, 1.8vmin, 1.05rem); font-weight: 750; }
    @keyframes feedback-pop {
      0% { opacity: 0; transform: translate(-50%,-50%) scale(.78); }
      18%,78% { opacity: 1; transform: translate(-50%,-50%) scale(1); }
      100% { opacity: 0; transform: translate(-50%,-50%) scale(1.04); }
    }

    .streak-celebration {
      position: absolute;
      z-index: 25;
      inset: 0;
      overflow: hidden;
      visibility: hidden;
      pointer-events: none;
    }
    .streak-celebration.show { visibility: visible; }
    .streak-celebration::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 24%, rgba(255,223,100,.28), transparent 48%);
      opacity: 0;
    }
    .streak-celebration.show::before { animation: streak-glow 1.4s ease-out both; }
    .streak-celebration.major::before {
      background:
        radial-gradient(circle at 50% 28%, rgba(255,241,157,.46), transparent 38%),
        radial-gradient(circle at 50% 50%, rgba(123,240,191,.18), transparent 68%);
      animation-duration: 2s;
    }
    .streak-celebration__message {
      position: absolute;
      z-index: 2;
      top: 24%;
      left: 50%;
      min-width: min(38vw, 260px);
      padding: 18px 28px;
      border: 2px solid rgba(255,255,255,.5);
      border-radius: 999px;
      background: rgba(17,19,24,.9);
      box-shadow: 0 16px 50px rgba(0,0,0,.38), 0 0 34px rgba(255,216,90,.3);
      opacity: 0;
      transform: translate(-50%,-50%) scale(.65);
      text-align: center;
    }
    .streak-celebration__message::before {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      width: 80px;
      aspect-ratio: 1;
      border: 4px solid rgba(255,226,116,.82);
      border-radius: 50%;
      opacity: 0;
      transform: translate(-50%,-50%) scale(.45);
    }
    .streak-celebration.show .streak-celebration__message { animation: streak-message 1.4s ease-out both; }
    .streak-celebration.show .streak-celebration__message::before { animation: streak-ring 1.05s ease-out both; }
    .streak-celebration__message strong {
      display: block;
      color: #fff4ae;
      font-size: clamp(2rem, 7vmin, 4.2rem);
      font-weight: 950;
      line-height: 1;
      letter-spacing: -.05em;
      text-shadow: 0 4px 20px rgba(255,198,52,.45);
    }
    .streak-celebration.major .streak-celebration__message {
      min-width: min(54vw, 420px);
      padding: 24px 36px;
      border-width: 4px;
      box-shadow: 0 22px 80px rgba(0,0,0,.5), 0 0 70px rgba(255,216,90,.58);
    }
    .streak-celebration.major .streak-celebration__message strong { font-size: clamp(3.1rem, 10vmin, 6.7rem); }

    /* Flat palette theme */
    :root {
      color-scheme: light;
      --ink: #384959;
      --steel: #6A89A7;
      --powder: #BDDDFC;
      --sky: #88BDF2;
      --paper: #F8FBFE;
      --surface: #EAF3FB;
      --line: #6A89A7;
      --danger: #B85F6C;
      --success: #537E72;
      background: var(--powder);
      color: var(--ink);
    }

    body { background: var(--powder); color: var(--ink); }
    .welcome, .menu { background: var(--powder); }

    .welcome .panel {
      padding: clamp(24px, 5vw, 34px);
      border: 2px solid var(--ink);
      border-radius: 20px;
      background: var(--paper);
    }

    .brand { color: var(--steel); }
    .subtitle, .field-label { color: var(--ink); }
    .activity-chip {
      border: 1px solid var(--steel);
      border-radius: 9px;
      background: var(--surface);
      color: var(--ink);
    }

    .select, .text-input {
      border: 2px solid var(--steel);
      border-radius: 12px;
      background: #fff;
      color: var(--ink);
    }
    .select:focus, .text-input:focus {
      border-color: var(--ink);
      box-shadow: 0 0 0 3px rgba(136,189,242,.45);
    }
    .study-option {
      border: 1px solid var(--steel);
      border-radius: 12px;
      background: var(--surface);
      color: var(--ink);
    }
    .study-option input, .info-dismiss input { accent-color: var(--steel); }
    .study-option strong, .study-option span { color: var(--ink); }

    .primary-button, .secondary-button, .danger-button {
      border-radius: 12px;
      box-shadow: none;
    }
    .primary-button { background: var(--ink); color: #fff; }
    .secondary-button {
      border: 2px solid var(--steel);
      background: var(--paper);
      color: var(--ink);
    }
    .danger-button {
      border: 2px solid var(--danger);
      background: var(--paper);
      color: var(--danger);
    }
    button:focus-visible, input:focus-visible, select:focus-visible {
      outline-color: var(--ink);
    }

    .activity-list { gap: 14px; }
    .activity-card {
      border: 2px solid var(--ink);
      border-radius: 18px;
      box-shadow: none;
    }
    .activity-card--prime { background: var(--steel); color: #fff; }
    .activity-card--grammar { background: var(--powder); color: var(--ink); }
    .activity-card--ing { background: var(--sky); color: var(--ink); }
    .activity-card--sentence-error { background: var(--ink); color: #fff; }
    .activity-card__icon, .activity-card::after { color: inherit; }

    .icon-button, .pill {
      border: 2px solid var(--ink);
      border-radius: 12px;
      background: var(--paper);
      color: var(--ink);
      box-shadow: none;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
    }
    .pill__label { color: var(--steel); }
    .study-toggle[aria-pressed="true"] {
      border-color: var(--ink);
      background: var(--sky);
      color: var(--ink);
    }

    .prime-choice--yes, .ing-choice--gerund, .sentence-error-choice--incorrect {
      background: var(--steel);
      color: #fff;
    }
    .prime-choice--no, .ing-choice--participle, .sentence-error-choice--correct {
      background: var(--sky);
      color: var(--ink);
    }
    .choice__hint { color: currentColor; opacity: .72; }
    .prime-divider, .sentence-error-divider,
    .grammar-lines::before, .grammar-lines::after {
      background: rgba(56,73,89,.4);
    }

    .grammar-choice:nth-child(1) { background: var(--steel); color: #fff; }
    .grammar-choice:nth-child(2) { background: var(--powder); color: var(--ink); }
    .grammar-choice:nth-child(3) { background: var(--sky); color: var(--ink); }
    .grammar-choice:nth-child(4) { background: var(--ink); color: #fff; }
    .choice-key {
      border: 2px solid currentColor;
      border-radius: 10px;
      background: var(--paper);
      box-shadow: none;
      color: var(--ink);
    }

    .game-timer {
      padding: 7px 9px 9px;
      border: 2px solid var(--ink);
      border-radius: 12px;
      background: var(--paper);
    }
    .game-timer__meta { color: var(--ink); }
    .game-timer__track {
      border: 1px solid var(--steel);
      background: var(--powder);
    }
    .game-timer__bar { background: var(--steel); }
    .game-timer.urgent .game-timer__bar { background: var(--danger); }

    .center-card, .sentence-error-stage .sentence-error-card {
      border: 3px solid var(--ink);
      border-radius: 16px;
      background: var(--paper);
      box-shadow: none;
      color: var(--ink);
    }
    .sentence-error-guide {
      padding: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
    }
    .sentence-error-guide__incorrect { color: #fff; }
    .sentence-error-guide__correct { color: var(--ink); }
    .sentence-error-empty { background: var(--powder); color: var(--ink); }
    .marked-ing, .ing-meaning-emphasis {
      padding-inline: .08em;
      background: var(--powder);
      color: var(--ink);
      text-decoration-color: var(--steel);
    }

    .answer-feedback {
      border-radius: 14px;
      box-shadow: none;
    }
    .answer-feedback.correct {
      border-color: var(--success);
      background: var(--paper);
      color: var(--success);
    }
    .answer-feedback.wrong {
      border-color: var(--danger);
      background: var(--paper);
      color: var(--danger);
    }
    .choice.answer-correct {
      filter: none;
      box-shadow: inset 0 0 0 clamp(6px, .9vmin, 11px) var(--paper);
    }
    .choice.answer-wrong {
      filter: brightness(.88);
      box-shadow: inset 0 0 0 clamp(6px, .9vmin, 11px) var(--danger);
    }

    .streak-celebration::before,
    .streak-celebration__message::before { display: none; }
    .streak-celebration__message,
    .streak-celebration.major .streak-celebration__message {
      border: 3px solid var(--sky);
      border-radius: 16px;
      background: var(--paper);
      box-shadow: none;
    }
    .streak-celebration__message strong {
      color: var(--ink);
      text-shadow: none;
    }
    .confetti-piece { box-shadow: none; }

    .modal {
      background: rgba(56,73,89,.78);
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
    }
    .modal__card {
      border: 3px solid var(--ink);
      border-radius: 20px;
      background: var(--paper);
      box-shadow: none;
      color: var(--ink);
    }
    .modal__eyebrow, .modal__eyebrow.info { color: var(--steel); }
    .modal__message { color: var(--ink); }
    .study-explanation-toolbar strong { color: var(--ink); }
    .button-shortcut {
      border-color: var(--steel);
      background: var(--surface);
      color: var(--ink);
    }
    .primary-button .button-shortcut {
      border-color: var(--powder);
      background: transparent;
      color: #fff;
    }
    .stat { background: var(--surface); }
    .stat span { color: var(--steel); }

    .leaderboard__list {
      border: 1px solid var(--steel);
      background: #fff;
    }
    .leaderboard__row {
      border-bottom-color: var(--powder);
      color: var(--ink);
    }
    .leaderboard__row.current {
      background: var(--powder);
      color: var(--ink);
    }
    .leaderboard__rank, .leaderboard__empty { color: var(--steel); }

    .ing-result__answer, .sentence-error-result__answer {
      border-color: var(--steel);
      background: var(--powder);
      color: var(--ink);
    }
    .ing-result__section, .sentence-error-result__section,
    .info-dismiss,
    #info-modal .modal__message,
    #study-explanation-modal .modal__message,
    #result-modal .modal__message {
      background: var(--surface);
      color: var(--ink);
    }
    .ing-result__label, .sentence-error-result__label { color: var(--steel); }
    .ing-result__sentence, .ing-result__translation, .ing-result__grammar,
    .sentence-diff, .sentence-error-result__text { color: var(--ink); }
    .ing-grammar-focus { color: var(--ink); }
    .ing-grammar-answer {
      border-color: var(--steel);
      background: var(--powder);
      color: var(--ink);
    }
    .sentence-diff__delete {
      color: #D9273E;
      font-weight: 950;
      text-decoration-line: line-through;
      text-decoration-thickness: .14em;
      text-decoration-color: #D9273E;
    }
    .sentence-diff__insert {
      border-bottom-color: #337BB5;
      background: #DCEEFF;
      color: var(--ink);
      font-weight: 950;
    }
    .sentence-change-chip {
      border-color: var(--steel);
      background: var(--powder);
      color: var(--ink);
    }
    .round-over-answer {
      display: inline-block;
      margin-left: .25em;
      font-size: .42em;
      font-weight: 900;
      letter-spacing: -.02em;
      vertical-align: middle;
      white-space: nowrap;
    }
    .link-button { color: var(--steel); }

    @media (hover: hover) {
      .activity-card:hover {
        border-color: var(--ink);
        filter: brightness(1.03);
        box-shadow: none;
      }
      .icon-button:hover, .secondary-button:hover {
        border-color: var(--ink);
        filter: none;
        background: var(--powder);
      }
      .primary-button:hover { filter: brightness(1.08); }
      .link-button:hover { color: var(--ink); }
    }
  </style>
</head>
<body>
  <section class="screen welcome" id="welcome-screen" aria-labelledby="welcome-title">
    <form class="panel" id="name-form">
      <button class="icon-button welcome__back" id="back-to-activities" type="button">← 활동 다시 고르기</button>
      <p class="brand">QUICK TAP</p>
      <span class="activity-chip" id="selected-activity-label"></span>
      <h1 id="welcome-title">플레이어를<br>선택하세요</h1>
      <p class="subtitle" id="welcome-subtitle">이름별 최고 연속 정답 기록이 이 기기의 리더보드에 저장됩니다.</p>
      <label class="field-label" for="name-select">이름</label>
      <select class="select" id="name-select" required></select>
      <input class="text-input" id="custom-name" type="text" maxlength="20" autocomplete="name" placeholder="이름을 입력하세요" aria-label="직접 입력할 이름" hidden>
      <label class="study-option" id="study-mode-option" for="study-mode-input" hidden>
        <input id="study-mode-input" type="checkbox">
        <span>
          <strong>학습 모드로 시작</strong>
          <span>시간 제한과 게임 오버 없이 천천히 복습해요.</span>
        </span>
      </label>
      <button class="primary-button" type="submit">시작하기</button>
    </form>
  </section>

  <section class="screen menu active" id="menu-screen" aria-label="활동 선택">
    <div class="panel">
      <div class="activity-list">
        <button class="activity-card activity-card--prime" type="button" data-start="prime">
          <span class="activity-card__icon">2, 3, 5</span>
          <strong>소수 판별</strong>
        </button>
        <button class="activity-card activity-card--grammar" type="button" data-start="grammar">
          <span class="activity-card__icon">to / -ing</span>
          <strong>동사의 목적어</strong>
        </button>
        <button class="activity-card activity-card--ing" type="button" data-start="ing">
          <span class="activity-card__icon">G / P</span>
          <strong>동명사 / 현재분사</strong>
        </button>
        <button class="activity-card activity-card--sentence-error" id="sentence-error-start" type="button" data-start="sentence-error">
          <span class="activity-card__icon">✓ / ✕</span>
          <strong>문장 오류 찾기</strong>
        </button>
      </div>
    </div>
  </section>

  <main class="screen game" id="prime-screen" aria-label="소수 판별 게임">
    <button class="choice prime-choice prime-choice--yes" type="button" data-prime-answer="prime" aria-label="소수, Prime Number">
      <span class="choice__label">소수 · Prime Number<span class="choice__hint">↑</span></span>
    </button>
    <button class="choice prime-choice prime-choice--no" type="button" data-prime-answer="not-prime" aria-label="합성수, Composite Number">
      <span class="choice__label">합성수 · Composite Number<span class="choice__hint">↓</span></span>
    </button>
    <div class="topbar">
      <button class="icon-button" type="button" data-change-player><span class="button-label--wide">← 이름 바꾸기</span><span class="button-label--short">← 이름</span></button>
      <div class="score-group">
        <div class="pill"><span class="pill__label">연속</span><span class="pill__value" id="prime-score">0</span></div>
        <div class="pill"><span class="pill__label">최고</span><span class="pill__value" id="prime-best">0</span></div>
      </div>
    </div>
    <div class="game-timer" id="prime-timer" role="timer" aria-live="off">
      <div class="game-timer__meta"><span>남은 시간</span><strong id="prime-timer-label">2.0초</strong></div>
      <div class="game-timer__track"><span class="game-timer__bar" id="prime-timer-bar"></span></div>
    </div>
    <div class="prime-divider" aria-hidden="true"></div>
    <div class="center-card number" id="number" aria-live="assertive">2</div>
    <div class="flash" id="prime-flash" aria-hidden="true"></div>
    <div class="answer-feedback" id="prime-feedback" role="status" aria-live="assertive"><strong></strong><span></span></div>
  </main>

  <main class="screen game" id="grammar-screen" aria-label="동사의 목적어 분류 게임">
    <div class="grammar-grid grammar-lines">
      <button class="choice grammar-choice" type="button" data-grammar-answer="gerund" aria-label="1번, 동명사"><kbd class="choice-key" aria-hidden="true">1</kbd><span class="choice__label">동명사</span></button>
      <button class="choice grammar-choice" type="button" data-grammar-answer="infinitive" aria-label="2번, to 부정사"><kbd class="choice-key" aria-hidden="true">2</kbd><span class="choice__label">to 부정사</span></button>
      <button class="choice grammar-choice" type="button" data-grammar-answer="both-same" aria-label="3번, 둘 다 의미 차이 없음"><kbd class="choice-key" aria-hidden="true">3</kbd><span class="choice__label">둘 다<br>(의미 차이 X)</span></button>
      <button class="choice grammar-choice" type="button" data-grammar-answer="both-different" aria-label="4번, 둘 다 의미 차이 있음"><kbd class="choice-key" aria-hidden="true">4</kbd><span class="choice__label">둘 다<br>(의미 차이 O)</span></button>
    </div>
    <div class="topbar">
      <div class="topbar__actions">
        <button class="icon-button" type="button" data-change-player><span class="button-label--wide">← 이름 바꾸기</span><span class="button-label--short">← 이름</span></button>
        <button class="icon-button study-toggle" type="button" data-study-toggle aria-pressed="false">학습 모드</button>
      </div>
      <div class="score-group">
        <div class="pill"><span class="pill__label" id="grammar-score-label">연속</span><span class="pill__value" id="grammar-score">0</span></div>
        <div class="pill"><span class="pill__label" id="grammar-best-label">최고</span><span class="pill__value" id="grammar-best">0</span></div>
      </div>
    </div>
    <div class="game-timer" id="grammar-timer" role="timer" aria-live="off">
      <div class="game-timer__meta"><span>남은 시간</span><strong id="grammar-timer-label">5.0초</strong></div>
      <div class="game-timer__track"><span class="game-timer__bar" id="grammar-timer-bar"></span></div>
    </div>
    <div class="center-card verb" id="verb" aria-live="assertive">enjoy</div>
    <div class="flash" id="grammar-flash" aria-hidden="true"></div>
    <div class="answer-feedback" id="grammar-feedback" role="status" aria-live="assertive"><strong></strong><span></span></div>
  </main>

  <main class="screen game" id="ing-screen" aria-label="동명사와 현재분사 판단 게임">
    <button class="choice ing-choice ing-choice--gerund" type="button" data-ing-answer="gerund" aria-label="동명사, Gerund">
      <span class="choice__label">동명사(Gerund)<span class="choice__hint">↑</span></span>
    </button>
    <button class="choice ing-choice ing-choice--participle" type="button" data-ing-answer="participle" aria-label="현재분사, Participle">
      <span class="choice__label">현재분사(Participle)<span class="choice__hint">↓</span></span>
    </button>
    <div class="topbar">
      <div class="topbar__actions">
        <button class="icon-button" type="button" data-change-player><span class="button-label--wide">← 이름 바꾸기</span><span class="button-label--short">← 이름</span></button>
        <button class="icon-button study-toggle" type="button" data-study-toggle aria-pressed="false">학습 모드</button>
      </div>
      <div class="score-group">
        <div class="pill"><span class="pill__label" id="ing-score-label">연속</span><span class="pill__value" id="ing-score">0</span></div>
        <div class="pill"><span class="pill__label" id="ing-best-label">최고</span><span class="pill__value" id="ing-best">0</span></div>
      </div>
    </div>
    <div class="game-timer" id="ing-timer" role="timer" aria-live="off">
      <div class="game-timer__meta"><span>남은 시간</span><strong id="ing-timer-label">7.0초</strong></div>
      <div class="game-timer__track"><span class="game-timer__bar" id="ing-timer-bar"></span></div>
    </div>
    <div class="prime-divider" aria-hidden="true"></div>
    <div class="center-card ing-sentence" id="ing-sentence" aria-live="assertive"></div>
    <div class="flash" id="ing-flash" aria-hidden="true"></div>
    <div class="answer-feedback" id="ing-feedback" role="status" aria-live="assertive"><strong></strong><span></span></div>
  </main>

  <main class="screen game" id="sentence-error-screen" aria-label="문장 오류 찾기 게임">
    <button class="choice sentence-error-choice sentence-error-choice--correct" type="button" data-sentence-error-answer="correct" aria-label="2번, 맞음"></button>
    <button class="choice sentence-error-choice sentence-error-choice--incorrect" type="button" data-sentence-error-answer="incorrect" aria-label="1번, 틀림"></button>
    <div class="topbar">
      <div class="topbar__actions">
        <button class="icon-button" type="button" data-change-player><span class="button-label--wide">← 이름 바꾸기</span><span class="button-label--short">← 이름</span></button>
        <button class="icon-button study-toggle" type="button" data-study-toggle aria-pressed="false">학습 모드</button>
      </div>
      <div class="score-group">
        <div class="pill"><span class="pill__label" id="sentence-error-score-label">연속</span><span class="pill__value" id="sentence-error-score">0</span></div>
        <div class="pill"><span class="pill__label" id="sentence-error-best-label">최고</span><span class="pill__value" id="sentence-error-best">0</span></div>
      </div>
    </div>
    <div class="game-timer" id="sentence-error-timer" role="timer" aria-live="off">
      <div class="game-timer__meta"><span>남은 시간</span><strong id="sentence-error-timer-label">10.0초</strong></div>
      <div class="game-timer__track"><span class="game-timer__bar" id="sentence-error-timer-bar"></span></div>
    </div>
    <div class="sentence-error-divider" aria-hidden="true"></div>
    <div class="sentence-error-guides" aria-hidden="true">
      <span class="sentence-error-guide sentence-error-guide__incorrect">틀림</span>
      <span class="sentence-error-guide sentence-error-guide__correct">맞음</span>
    </div>
    <div class="sentence-error-stage">
      <div class="center-card sentence-error-card" id="sentence-error-sentence" aria-live="assertive"></div>
    </div>
    <div class="sentence-error-empty" id="sentence-error-empty" hidden>
      <p>등록된 문장 오류 문제가 없습니다.</p>
      <button class="secondary-button" id="sentence-error-empty-back" type="button">활동 선택으로</button>
    </div>
    <div class="flash" id="sentence-error-flash" aria-hidden="true"></div>
    <div class="answer-feedback" id="sentence-error-feedback" role="status" aria-live="assertive"><strong></strong><span></span></div>
  </main>

  <div class="streak-celebration" id="streak-celebration" role="status" aria-live="polite" aria-atomic="true">
    <div class="streak-celebration__message">
      <strong id="streak-celebration-score"></strong>
    </div>
    <div class="streak-celebration__particles" id="streak-celebration-particles" aria-hidden="true"></div>
  </div>

  <section class="modal" id="info-modal" role="dialog" aria-modal="true" aria-labelledby="info-title">
    <div class="modal__card">
      <p class="modal__eyebrow info">USAGE NOTE</p>
      <h2 id="info-title">기억해 두세요</h2>
      <p class="modal__message" id="info-message"></p>
      <label class="info-dismiss" for="hide-word-note">
        <input id="hide-word-note" type="checkbox">
        <span>이 단어에 대한 설명을 앞으로 띄우지 않음</span>
      </label>
      <button class="primary-button" id="info-continue" type="button">계속하기</button>
    </div>
  </section>

  <section class="modal" id="study-explanation-modal" role="dialog" aria-modal="true" aria-labelledby="study-explanation-title">
    <div class="modal__card">
      <div class="study-explanation-toolbar">
        <strong id="study-explanation-title">오답 해설</strong>
        <div class="study-explanation-actions">
          <button class="secondary-button" type="button" data-change-player aria-keyshortcuts="C">플레이어 바꾸기<kbd class="button-shortcut" aria-hidden="true">C</kbd></button>
          <button class="primary-button" type="button" data-restart-activity aria-keyshortcuts="R">다시 시작<kbd class="button-shortcut" aria-hidden="true">R</kbd></button>
        </div>
      </div>
      <div class="study-explanation-scroll">
        <div class="modal__message" id="study-explanation-message"></div>
        <button class="primary-button" id="study-explanation-continue" type="button">다음 문제</button>
      </div>
    </div>
  </section>

  <section class="modal" id="result-modal" role="dialog" aria-modal="true" aria-labelledby="result-title">
    <div class="modal__card">
      <div class="result-modal__header">
        <div class="result-player-toolbar">
          <button class="secondary-button" id="change-result-player" type="button" aria-keyshortcuts="C">플레이어 바꾸기<kbd class="button-shortcut" aria-hidden="true">C</kbd></button>
          <button class="primary-button" id="restart" type="button" aria-keyshortcuts="R">다시 시작<kbd class="button-shortcut" aria-hidden="true">R</kbd></button>
        </div>
        <p class="modal__eyebrow">ROUND OVER</p>
        <h2 id="result-title">아쉬워요!</h2>
      </div>
      <div class="result-scroll-content" id="result-scroll-content">
        <div class="modal__message" id="result-message"></div>
        <div class="stats">
          <div class="stat"><span>이번 기록</span><strong id="final-score">0</strong></div>
          <div class="stat"><span>나의 최고 기록</span><strong id="final-best">0</strong></div>
        </div>
        <div class="leaderboard">
          <div class="leaderboard__title"><h3 id="leaderboard-title">리더보드</h3></div>
          <ol class="leaderboard__list" id="leaderboard-list"></ol>
        </div>
        <button class="link-button" id="reset-leaderboard" type="button">이 활동 리더보드 초기화</button>
      </div>
    </div>
  </section>

  <script src="ing-data.js"></script>
  <script src="sentence-error-data.js"></script>
  <script>
    const PLAYER_NAMES = [
      '박범준', '배승우', '윤해든', '이룩', '이수민', '이우진', '이은수', '이지우',
      '임윤아', '채범기', '한지아', '가서연', '김경민', '김시아', '이은성',
      '강용제', '김예승', '김재윤', '김하준', '박시현', '박이환', '백시율', '이해원',
      '조현우', '지수연', '황은찬'
    ].sort((a, b) => a.localeCompare(b, 'ko'));

    const VERBS = [
      ...['enjoy', 'finish', 'keep', 'stop', 'avoid', 'give up', 'mind', 'consider', 'put off'].map(verb => ({ verb, category: 'gerund' })),
      ...['want', 'decide', 'hope', 'expect', 'plan', 'ask', 'promise', 'refuse'].map(verb => ({ verb, category: 'infinitive' })),
      ...['like', 'love', 'hate', 'begin', 'dislike', 'start', 'continue'].map(verb => ({ verb, category: 'both-same' })),
      ...['remember', 'forget', 'try', 'regret'].map(verb => ({ verb, category: 'both-different' }))
    ];
    const VERB_COOLDOWN = 8;

    const CATEGORY_LABELS = {
      gerund: '동명사',
      infinitive: 'to 부정사',
      'both-same': '둘 다 (의미 차이 X)',
      'both-different': '둘 다 (의미 차이 O)'
    };

    const ACTIVITY_LABELS = {
      prime: '소수 판별',
      grammar: '동사의 목적어',
      ing: '동명사 / 현재분사',
      'sentence-error': '문장 오류 찾기'
    };
    const STUDY_ACTIVITY_KEYS = new Set(['grammar', 'ing', 'sentence-error']);
    const ROUND_OVER_TITLES = [
      '아쉬워요!',
      '잘 하지~',
      '아쉽다~',
      '와 이걸 틀리네',
      '엌ㅋㅋㅋ',
      '왘ㅋㅋㅋㅋ진짴ㅋㅋㅋ',
      '와 이걸 진짜.. 와 ㅋㅋㅋ',
      '수준~'

    function tokenizeSentenceForDiff(sentence) {
      return sentence.match(/\s+|[\p{L}\p{N}]+(?:['’][\p{L}\p{N}]+)*|[^\s\p{L}\p{N}]/gu) || [];
    }

    function mergeSentenceDiffSegments(segments) {
      return segments.reduce((merged, segment) => {
        const previous = merged.at(-1);
        if (previous?.type === segment.type) previous.text += segment.text;
        else merged.push({ type: segment.type, text: segment.text });
        return merged;
      }, []);
    }

    function refineSentenceReplacements(segments) {
      const refined = [];
      for (let index = 0; index < segments.length; index += 1) {
        const first = segments[index];
        const second = segments[index + 1];
        const replacement = first?.type === 'delete' && second?.type === 'insert'
          ? { deleted: first.text, inserted: second.text }
          : first?.type === 'insert' && second?.type === 'delete'
            ? { deleted: second.text, inserted: first.text }
            : null;

        if (!replacement || /\s/u.test(replacement.deleted) || /\s/u.test(replacement.inserted)) {
          refined.push(first);
          continue;
        }

        let prefixLength = 0;
        const maxPrefixLength = Math.min(replacement.deleted.length, replacement.inserted.length);
        while (
          prefixLength < maxPrefixLength
          && replacement.deleted[prefixLength] === replacement.inserted[prefixLength]
        ) {
          prefixLength += 1;
        }

        if (!prefixLength) {
          refined.push(first);
          continue;
        }

        refined.push({ type: 'same', text: replacement.deleted.slice(0, prefixLength) });
        const deletedRemainder = replacement.deleted.slice(prefixLength);
        const insertedRemainder = replacement.inserted.slice(prefixLength);
        if (deletedRemainder) refined.push({ type: 'delete', text: deletedRemainder });
        if (insertedRemainder) refined.push({ type: 'insert', text: insertedRemainder });
        index += 1;
      }
      return mergeSentenceDiffSegments(refined);
    }

    function generateSentenceDiff(incorrect, correct) {
      const before = tokenizeSentenceForDiff(incorrect);
      const after = tokenizeSentenceForDiff(correct);
      const table = Array.from({ length: before.length + 1 }, () => Array(after.length + 1).fill(0));

      for (let left = before.length - 1; left >= 0; left -= 1) {
        for (let right = after.length - 1; right >= 0; right -= 1) {
          table[left][right] = before[left] === after[right]
            ? table[left + 1][right + 1] + 1
            : Math.max(table[left + 1][right], table[left][right + 1]);
        }
      }

      const segments = [];
      let left = 0;
      let right = 0;
      while (left < before.length && right < after.length) {
        if (
          before[left] === after[right]
          && table[left + 1][right] === table[left][right]
        ) {
          segments.push({ type: 'delete', text: before[left] });
          left += 1;
        } else if (before[left] === after[right]) {
          segments.push({ type: 'same', text: before[left] });
          left += 1;
          right += 1;
        } else if (table[left + 1][right] >= table[left][right + 1]) {
          segments.push({ type: 'delete', text: before[left] });
          left += 1;
        } else {
          segments.push({ type: 'insert', text: after[right] });
          right += 1;
        }
      }
      while (left < before.length) segments.push({ type: 'delete', text: before[left++] });
      while (right < after.length) segments.push({ type: 'insert', text: after[right++] });
      return refineSentenceReplacements(mergeSentenceDiffSegments(segments));
    }

    function validateSentenceErrorItems(rawItems) {
      if (!Array.isArray(rawItems)) {
        console.warn('[문장 오류 찾기] SENTENCE_ERROR_ITEMS 배열을 찾을 수 없습니다.');
        return [];
      }

      const seenIds = new Set();
      const validItems = [];
      rawItems.forEach((rawItem, index) => {
        const id = typeof rawItem?.id === 'string' ? rawItem.id.trim() : '';
        const incorrect = typeof rawItem?.incorrect === 'string' ? rawItem.incorrect.trim() : '';
        const correct = typeof rawItem?.correct === 'string' ? rawItem.correct.trim() : '';
        const reason = typeof rawItem?.reason === 'string'
          ? rawItem.reason.trim()
          : typeof rawItem?.explanation === 'string'
            ? rawItem.explanation.trim()
            : '';
        const warningPrefix = `[문장 오류 찾기] ${id || `항목 ${index + 1}`}`;

        if (!id || seenIds.has(id)) {
          console.warn(`${warningPrefix}: 비어 있거나 중복된 ID라서 제외했습니다.`);
          return;
        }
        seenIds.add(id);
        if (!incorrect || !correct || incorrect === correct || !reason) {
          console.warn(`${warningPrefix}: 필수 문장·이유가 없거나 두 문장이 같아서 제외했습니다.`);
          return;
        }

        let diff = null;
        if (rawItem.diff != null) {
          if (!Array.isArray(rawItem.diff) || rawItem.diff.some(segment => (
            !segment || !SENTENCE_ERROR_DIFF_TYPES.has(segment.type) || typeof segment.text !== 'string'
          ))) {
            console.warn(`${warningPrefix}: 지원하지 않는 diff 형식이라서 항목을 제외했습니다.`);
            return;
          }
          const explicitDiff = rawItem.diff.map(segment => ({ type: segment.type, text: segment.text }));
          const rebuiltIncorrect = explicitDiff
            .filter(segment => segment.type !== 'insert')
            .map(segment => segment.text)
            .join('');
          const rebuiltCorrect = explicitDiff
            .filter(segment => segment.type !== 'delete')
            .map(segment => segment.text)
            .join('');
          if (rebuiltIncorrect === incorrect && rebuiltCorrect === correct) diff = explicitDiff;
          else console.warn(`${warningPrefix}: 명시적 diff가 문장을 재현하지 못해 자동 diff로 대체했습니다.`);
        }

        const variants = Array.isArray(rawItem.variants)
          ? [...new Set(rawItem.variants.filter(variant => SENTENCE_ERROR_VARIANTS.has(variant)))]
          : ['incorrect', 'correct'];
        validItems.push({
          id,
          incorrect,
          correct,
          reason,
          translation: typeof rawItem.translation === 'string' ? rawItem.translation.trim() : '',
          category: typeof rawItem.category === 'string' ? rawItem.category : '',
          level: typeof rawItem.level === 'string' ? rawItem.level : '',
          tags: Array.isArray(rawItem.tags) ? rawItem.tags.filter(tag => typeof tag === 'string') : [],
          weight: Number.isFinite(Number(rawItem.weight)) && Number(rawItem.weight) > 0 ? Number(rawItem.weight) : 1,
          variants: variants.length ? variants : ['incorrect', 'correct'],
          diff: diff || generateSentenceDiff(incorrect, correct)
        });
      });
      return validItems;
    }

    function loadStudyState() {
      const validIds = getStudyItemIds();
      try {
        const saved = JSON.parse(localStorage.getItem(getStudyStorageKey()));
        const rounds = Number.isInteger(saved?.rounds) && saved.rounds >= 0 ? saved.rounds : 0;
        const reviews = {};
        Object.entries(saved?.reviews || {}).forEach(([id, review]) => {
          const stage = Number(review?.stage);
          const due = Number(review?.due);
          const addedAt = Number(review?.addedAt);
          const correctStreak = Number(review?.correctStreak);
          if (!validIds.has(id) || !Number.isInteger(stage) || stage < 0 || stage >= STUDY_REVIEW_INTERVALS.length) return;
          if (!Number.isInteger(due) || due < 0) return;
          reviews[id] = {
            stage,
            due,
            addedAt: Number.isInteger(addedAt) && addedAt >= 0 ? addedAt : 0,
            correctStreak: Number.isInteger(correctStreak) && correctStreak >= 0
              ? Math.min(correctStreak, 1)
              : stage > 0 ? 1 : 0
          };
        });
        return { rounds, reviews };
      } catch {
        return { rounds: 0, reviews: {} };
      }
    }

    function pickWeightedItem(items) {
      if (!items.length) return null;
      const total = items.reduce((sum, item) => sum + (Number(item.weight) > 0 ? Number(item.weight) : 1), 0);
      let target = Math.random() * total;
      for (const item of items) {
        target -= Number(item.weight) > 0 ? Number(item.weight) : 1;
        if (target <= 0) return item;
      }
      return items.at(-1);
    }

    function getStudySelection(items, getId, recentIds) {
      const dueEntries = Object.entries(studyState.reviews)
        .filter(([, review]) => review.due <= studyState.rounds)
        .sort((a, b) => b[1].addedAt - a[1].addedAt || a[1].due - b[1].due);
      if (dueEntries.length) {
        const dueId = dueEntries[0][0];
        const dueItem = items.find(item => getId(item) === dueId);
        if (dueItem) {
          dueEntries.slice(1).forEach(([, review]) => {
            const nextStage = Math.min(review.stage + 1, STUDY_REVIEW_INTERVALS.length - 1);
            review.stage = nextStage;
            review.due = studyState.rounds + 1 + STUDY_REVIEW_INTERVALS[nextStage];
          });
          if (dueEntries.length > 1) saveStudyState();
          return { item: dueItem, id: dueId, isReview: true };
        }
      }

      const available = items.filter(item => {
        const id = getId(item);
        return !studyState.reviews[id] && !recentIds.includes(id);
      });
      const fallback = available.length
        ? available
        : items.filter(item => !studyState.reviews[getId(item)]);
      const candidates = fallback.length ? fallback : items;
      const item = pickWeightedItem(candidates);
      const id = getId(item);
      return { item, id, isReview: Boolean(studyState.reviews[id]) };
    }

    function recordStudyAnswer(itemId, isCorrect) {
      studyState.rounds += 1;
      const existing = studyState.reviews[itemId];
      let nextInterval = 0;
      let mastered = false;
      let correctStreak = 0;

      if (!isCorrect) {
        nextInterval = STUDY_REVIEW_INTERVALS[0];
        studyState.reviews[itemId] = {
          stage: 0,
          due: studyState.rounds + nextInterval,
          addedAt: studyState.rounds,
          correctStreak: 0
        };
      } else if (currentStudyItemIsReview && existing) {
        correctStreak = existing.correctStreak + 1;
        if (correctStreak >= 2) {
          delete studyState.reviews[itemId];
          mastered = true;
        } else {
          const nextStage = Math.min(existing.stage + 1, STUDY_REVIEW_INTERVALS.length - 1);
          nextInterval = STUDY_REVIEW_INTERVALS[nextStage];
          studyState.reviews[itemId] = {
            stage: nextStage,
            due: studyState.rounds + nextInterval,
            addedAt: existing.addedAt,
            correctStreak
          };
        }
      }

      saveStudyState();
      updateStudyModeUI();
      return { nextInterval, mastered, correctStreak };
    }

    function clearStreakCelebration() {
      window.clearTimeout(streakCelebrationTimeoutId);

    function celebrateStreak(value) {
      const milestone = getStreakMilestone(value);
      if (!milestone) return;

      clearStreakCelebration();
      const isMajor = milestone === 'major';
      const colors = ['#F8FBFE', '#BDDDFC', '#88BDF2', '#6A89A7', '#384959'];
      const particleCount = isMajor ? 84 : 42;
      const burstOrigins = isMajor
        ? [{ x: 25, y: 27 }, { x: 50, y: 20 }, { x: 75, y: 27 }]
        : [{ x: 42, y: 24 }, { x: 58, y: 24 }];
      const baseRadius = Math.min(window.innerWidth, window.innerHeight) * (isMajor ? .62 : .44);
      const particles = document.createDocumentFragment();

      for (let index = 0; index < particleCount; index += 1) {
        const piece = document.createElement('i');
        const origin = burstOrigins[index % burstOrigins.length];
        const angle = (Math.PI * 2 * index) / particleCount * burstOrigins.length + Math.random() * .34;
        const distance = baseRadius * (.52 + Math.random() * .55);
        const xMid = Math.cos(angle) * distance;
        const yMid = Math.sin(angle) * distance;
        const fall = (isMajor ? 210 : 140) + Math.random() * (isMajor ? 150 : 100);
        const spin = (Math.random() < .5 ? -1 : 1) * (300 + Math.random() * 620);
        const width = (isMajor ? 7 : 5) + Math.random() * (isMajor ? 8 : 6);
        const height = width * (1.2 + Math.random() * 1.5);

        piece.className = 'confetti-piece';
        piece.style.setProperty('--start-x', `${origin.x + (Math.random() - .5) * 4}%`);
        piece.style.setProperty('--start-y', `${origin.y + (Math.random() - .5) * 4}%`);
        piece.style.setProperty('--x-mid', `${xMid.toFixed(1)}px`);
        piece.style.setProperty('--y-mid', `${yMid.toFixed(1)}px`);
        piece.style.setProperty('--x-end', `${(xMid * 1.12).toFixed(1)}px`);
        piece.style.setProperty('--y-end', `${(yMid + fall).toFixed(1)}px`);
        piece.style.setProperty('--spin-mid', `${spin.toFixed(0)}deg`);
        piece.style.setProperty('--spin-end', `${(spin * 1.75).toFixed(0)}deg`);
        piece.style.setProperty('--piece-width', `${width.toFixed(1)}px`);
        piece.style.setProperty('--piece-height', `${height.toFixed(1)}px`);
        piece.style.setProperty('--color', colors[index % colors.length]);
        piece.style.setProperty('--delay', `${(Math.random() * (isMajor ? 180 : 100)).toFixed(0)}ms`);
        piece.style.setProperty('--duration', `${(isMajor ? 1550 : 1100) + Math.random() * 350}ms`);
        particles.append(piece);
      }

      streakCelebrationScoreEl.textContent = `${value}!`;
      streakCelebrationParticlesEl.append(particles);
      void streakCelebrationEl.offsetWidth;
      streakCelebrationEl.classList.add('show', milestone);
      streakCelebrationTimeoutId = window.setTimeout(clearStreakCelebration, isMajor ? 2200 : 1650);
    }

    function prepareAudio() {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (!AudioContextClass) return null;
      if (!audioContext) audioContext = new AudioContextClass();
      if (audioContext.state === 'suspended') audioContext.resume();
      return audioContext;
    }

    function playFeedbackSound(type) {
      if (!prepareAudio()) return;
      const startTime = audioContext.currentTime;
      const toneSets = {
        correct: [
          { frequency: 587.33, delay: 0, duration: .11, volume: .22, wave: 'triangle' },
          { frequency: 739.99, delay: .085, duration: .12, volume: .22, wave: 'triangle' },
          { frequency: 880, delay: .17, duration: .19, volume: .2, wave: 'triangle' }
        ],
        wrong: [
          { frequency: 880, delay: 0, duration: .12, volume: .18, wave: 'triangle' },
          { frequency: 739.99, delay: .095, duration: .15, volume: .17, wave: 'triangle' },
          { frequency: 587.33, endFrequency: 440, delay: .21, duration: .32, volume: .17, wave: 'triangle' }
        ],
        tick: [{ frequency: 1046.5, delay: 0, duration: .045, volume: .075, wave: 'triangle' }]
      };
      const tones = toneSets[type] || [];

      tones.forEach(tone => {
        const oscillator = audioContext.createOscillator();
        const gain = audioContext.createGain();
        const toneStart = startTime + tone.delay;
        const toneEnd = toneStart + tone.duration;
        oscillator.type = tone.wave || 'triangle';
        oscillator.frequency.setValueAtTime(tone.frequency, toneStart);
        if (tone.endFrequency) {
          oscillator.frequency.exponentialRampToValueAtTime(tone.endFrequency, toneEnd);
        }
        gain.gain.setValueAtTime(.0001, toneStart);
        gain.gain.exponentialRampToValueAtTime(tone.volume, toneStart + .018);
        gain.gain.exponentialRampToValueAtTime(.0001, toneEnd);
        oscillator.connect(gain);
        gain.connect(audioContext.destination);
        oscillator.start(toneStart);
        oscillator.stop(toneEnd);
      });
    }

    function parseMarkedText(marked) {
      const match = marked.match(/^(.*)\[([^\]]+)\](.*)$/);
      if (!match) return { before: '', target: marked, after: '' };
      return { before: match[1], target: match[2], after: match[3] };
    }

    function getIngGrammarExplanation(item) {
      const { before, after } = parseMarkedText(item.marked);
      const words = before.trim().replace(/[.,!?]+$/, '').split(/\s+/).filter(Boolean);
      const previousWord = words.at(-1) || '';
      const previousPhrase = previousWord === 'up' && words.length > 1
        ? `${words.at(-2)} up`
        : previousWord;
      const nextWord = after.trim().replace(/^[.,!?]+/, '').split(/\s+/).filter(Boolean)[0] || '';
      const nounLabels = {
        baby: '아기', dog: '개', sun: '태양', water: '물',
        girl: '소녀', man: '남자', students: '학생들', bird: '새', woman: '여자',
        children: '아이들', boy: '소년', horse: '말', leaves: '나뭇잎들',
        someone: '누군가', me: '나', him: '그',
        bag: '가방', car: '객차', pool: '수영장', room: '방', machine: '기계',
        lamp: '램프', lot: '주차 공간', stick: '지팡이', shoes: '신발', rod: '낚싯대',
        boat: '배', gloves: '장갑', oil: '기름', desk: '책상', rink: '링크',
        cart: '카트', school: '학교', glass: '잔', table: '탁자', cap: '모자'
      };
      const objectParticle = noun => {
        const lastCode = noun.charCodeAt(noun.length - 1) - 0xac00;
        const hasFinalConsonant = lastCode >= 0 && lastCode <= 11171 && lastCode % 28 !== 0;
        return hasFinalConsonant ? '을' : '를';
      };
      const usesFollowingNoun = item.role === 'noun-modifier-before' || item.role === 'noun-purpose';
      const modifiedNounKey = usesFollowingNoun ? nextWord : previousWord;
      const modifiedNoun = nounLabels[modifiedNounKey];
      const determiner = usesFollowingNoun ? previousWord : words.at(-2);
      const modifiedNounEnglish = `${['a', 'an', 'the'].includes(determiner) ? `${determiner} ` : ''}${modifiedNounKey}`.trim();
      const modifiedNounDisplay = modifiedNoun ? `${modifiedNoun}(${modifiedNounEnglish})` : '';
      const plainSentence = item.marked.replace(/[\[\]]/g, '');
      const subjectMatch = plainSentence.match(/^(.+?)\s+(?:is|takes|keeps|makes|can)\b/i);
      const complementSubject = before.trim().replace(/\s+(?:is|was)$/i, '');
      const answer = item.answer === 'gerund' ? '동명사' : '현재분사';
      const explanations = {
        subject: subjectMatch ? `“${subjectMatch[1]}”가 문장의 주어로 쓰인 동명사` : '문장의 주어로 쓰인 동명사',
        'verb-object': `동사 ${previousPhrase}의 목적어로 쓰인 동명사`,
        'preposition-object': `전치사 ${previousWord}의 목적어로 쓰인 동명사`,
        complement: `“${complementSubject}”의 내용을 설명하는 보어로 쓰인 동명사`,
        'fixed-expression': 'There is no use -ing 관용 표현에 쓰인 동명사',
        'omitted-preposition': '생략된 전치사 in의 목적어로 쓰인 동명사',
        'worth-complement': '형용사 worth 뒤에 쓰인 동명사',
        'noun-purpose': modifiedNounDisplay ? `“${modifiedNounDisplay}”의 용도를 나타내는 동명사` : '뒤 명사의 용도를 나타내는 동명사',
        progressive: `be동사 ${previousWord}와 함께 진행형을 만드는 현재분사`,
        'noun-modifier-before': modifiedNounDisplay ? `“${modifiedNounDisplay}”${objectParticle(modifiedNoun)} 꾸며주는 현재분사` : '뒤 명사를 꾸며주는 현재분사',
        'noun-modifier-after': modifiedNounDisplay ? `“${modifiedNounDisplay}”${objectParticle(modifiedNoun)} 꾸며주는 현재분사` : '앞 명사를 꾸며주는 현재분사',
        'object-complement': modifiedNounDisplay ? `“${modifiedNounDisplay}”의 동작을 설명하는 목적격 보어인 현재분사` : '목적어의 동작을 설명하는 목적격 보어인 현재분사',
        'simultaneous-action': `${words[0] === 'She' ? '그녀' : '그'}의 동시 동작을 나타내는 현재분사`,
        'adjective-complement': `“${complementSubject}”의 상태를 설명하는 보어로 쓰인 현재분사`
      };
      return {
        text: explanations[item.role] || `문장 속에서 쓰인 ${answer}`,
        focus: modifiedNounDisplay,
        answer
      };
    }

    function appendIngGrammarExplanation(container, item) {
      const explanation = getIngGrammarExplanation(item);
      const highlights = [
        { text: explanation.focus, className: 'ing-grammar-focus' },
        { text: explanation.answer, className: 'ing-grammar-answer' }
      ].filter(highlight => highlight.text && explanation.text.includes(highlight.text));
      let position = 0;

      while (position < explanation.text.length) {
        const next = highlights
          .map(highlight => ({ ...highlight, index: explanation.text.indexOf(highlight.text, position) }))
          .filter(highlight => highlight.index >= 0)
          .sort((a, b) => a.index - b.index)[0];
        if (!next) {
          container.append(document.createTextNode(explanation.text.slice(position)));
          break;
        }
        container.append(document.createTextNode(explanation.text.slice(position, next.index)));
        const emphasis = document.createElement('strong');
        emphasis.className = next.className;
        emphasis.textContent = next.text;
        container.append(emphasis);
        position = next.index + next.text.length;
      }
    }

    function appendMarkedSentence(container, marked) {
      const { before, target, after } = parseMarkedText(marked);
      container.append(document.createTextNode(before));
      const emphasis = document.createElement('strong');

      container.append(emphasis, document.createTextNode(after));

    function appendEmphasizedMeaning(container, text, emphasisText) {

      container.append(document.createTextNode(before));
      const emphasis = document.createElement('strong');
      emphasis.className = 'ing-meaning-emphasis';
      emphasis.textContent = emphasisText;
      container.append(emphasis, document.createTextNode(after));
    }

    function appendSentenceDiff(container, item, version) {
      item.diff.forEach(segment => {
        if (version === 'incorrect' && segment.type === 'insert') return;
        if (version === 'correct' && segment.type === 'delete') return;
        const leadingSpace = segment.text.match(/^\s+/u)?.[0] || '';
        const textAfterLeadingSpace = segment.text.slice(leadingSpace.length);
        const trailingSpace = textAfterLeadingSpace.match(/\s+$/u)?.[0] || '';
        const highlightedText = textAfterLeadingSpace.slice(
          0,
          textAfterLeadingSpace.length - trailingSpace.length
        );

        if (leadingSpace) container.append(document.createTextNode(leadingSpace));
        if (segment.type === 'delete') {
          if (highlightedText) {
            const deleted = document.createElement('del');
            deleted.className = 'sentence-diff__delete';
            deleted.textContent = highlightedText;
            container.append(deleted);
          }
        } else if (segment.type === 'insert') {
          if (highlightedText) {
            const inserted = document.createElement('ins');
            inserted.className = 'sentence-diff__insert';
            inserted.textContent = highlightedText;
            container.append(inserted);
          }
        } else if (highlightedText) {
          container.append(document.createTextNode(highlightedText));
        }
        if (trailingSpace) container.append(document.createTextNode(trailingSpace));
      });
    }

    function getSentenceChangeSummaries(item) {
      const summaries = [];
      let deleted = '';
      let inserted = '';
      const flush = () => {
        const before = deleted.trim();
        const after = inserted.trim();
        if (before || after) summaries.push({ before, after });
        deleted = '';
        inserted = '';
      };

      item.diff.forEach(segment => {
        if (segment.type === 'same') {
          if (segment.text.trim()) flush();
          return;
        }
        if (segment.type === 'delete') deleted += segment.text;
        if (segment.type === 'insert') inserted += segment.text;
      });
      flush();
      return summaries;
    }

    function createSentenceErrorSection(labelText, className = 'sentence-error-result__text') {
      const section = document.createElement('div');
      section.className = 'sentence-error-result__section';
      const label = document.createElement('span');
      label.className = 'sentence-error-result__label';

      content.className = className;
      section.append(label, content);
      return { section, content };
    }

    function createSentenceErrorExplanation(item, presentedVariant = 'incorrect') {
      const wrapper = document.createElement('div');
      wrapper.className = 'sentence-error-result';

      if (presentedVariant === 'correct') {
        const correct = createSentenceErrorSection('맞음', 'sentence-diff');
        correct.content.textContent = item.correct;
        wrapper.append(correct.section);
        return wrapper;
      }

      const incorrect = createSentenceErrorSection('틀림', 'sentence-diff');
      appendSentenceDiff(incorrect.content, item, 'incorrect');
      wrapper.append(incorrect.section);

      const correct = createSentenceErrorSection('맞음', 'sentence-diff');
      appendSentenceDiff(correct.content, item, 'correct');
      wrapper.append(correct.section);

      const summaries = getSentenceChangeSummaries(item);
      if (summaries.length) {
        const changes = createSentenceErrorSection('바뀐 부분', 'sentence-change-list');
        summaries.forEach(({ before, after }) => {
          const chip = document.createElement('span');
          chip.className = 'sentence-change-chip';
          if (before) {
            const deleted = document.createElement('del');
            deleted.className = 'sentence-diff__delete';
            deleted.textContent = before;
            chip.append(deleted);
          }
          if (before && after) chip.append(document.createTextNode(' → '));
          if (after) {
            const inserted = document.createElement('ins');
            inserted.className = 'sentence-diff__insert';
            inserted.textContent = after;
            chip.append(inserted);
          }
          if (before && !after) chip.append(document.createTextNode(' 삭제'));
          if (!before && after) chip.append(document.createTextNode(' 추가'));
          changes.content.append(chip);
        });
        wrapper.append(changes.section);
      }

      const reason = createSentenceErrorSection('이유');
      reason.content.textContent = item.reason;
      wrapper.append(reason.section);

      if (item.translation) {
        const translation = createSentenceErrorSection('해석');
        translation.content.textContent = item.translation;
        wrapper.append(translation.section);
      }
      return wrapper;
    }

    function isPrime(number) {
      if (number < 2) return false;
      if (number === 2) return true;
      if (number % 2 === 0) return false;
      for (let divisor = 3; divisor <= Math.sqrt(number); divisor += 2) {
        if (number % divisor === 0) return false;
      }
      return true;
    }

    function getPrimeFactors(number) {
      const factors = [];
      let remaining = number;
      for (let divisor = 2; divisor * divisor <= remaining; divisor += divisor === 2 ? 1 : 2) {
        while (remaining % divisor === 0) {
          factors.push(divisor);
          remaining /= divisor;
        }
      }
      if (remaining > 1) factors.push(remaining);
      return factors;
    }

    function nextPrimeNumber() {
      let next;
      do { next = Math.floor(Math.random() * 298) + 2; } while (next === currentNumber);
      currentNumber = next;
      numberEl.textContent = currentNumber;
      animateCard(numberEl);
    }

    function nextVerb() {
      if (studyMode) {
        const selection = getStudySelection(VERBS, item => item.verb, recentVerbs);
        currentVerb = selection.item;
        currentStudyItemId = selection.id;
        currentStudyItemIsReview = selection.isReview;
      } else {
        const availableVerbs = VERBS.filter(item => !recentVerbs.includes(item.verb));
        currentVerb = availableVerbs[Math.floor(Math.random() * availableVerbs.length)];
        currentStudyItemId = '';
        currentStudyItemIsReview = false;
      }
      recentVerbs.push(currentVerb.verb);
      if (recentVerbs.length > VERB_COOLDOWN) recentVerbs.shift();
      verbEl.textContent = currentVerb.verb;
      animateCard(verbEl);
    }

    function nextIngItem() {
      let nextIndex;
      if (studyMode) {
        const selection = getStudySelection(
          ING_QUESTIONS,
          item => String(ING_QUESTIONS.indexOf(item)),
          recentIngIndexes.map(String)
        );
        nextIndex = Number(selection.id);
        currentStudyItemId = selection.id;
        currentStudyItemIsReview = selection.isReview;
      } else {
        const availableIndexes = ING_QUESTIONS
          .map((item, index) => index)
          .filter(index => !recentIngIndexes.includes(index));
        nextIndex = availableIndexes[Math.floor(Math.random() * availableIndexes.length)];
        currentStudyItemId = '';
        currentStudyItemIsReview = false;
      }
      currentIngIndex = nextIndex;
      currentIngItem = ING_QUESTIONS[currentIngIndex];
      recentIngIndexes.push(currentIngIndex);
      if (recentIngIndexes.length > ING_COOLDOWN) recentIngIndexes.shift();
      ingSentenceEl.replaceChildren();
      appendMarkedSentence(ingSentenceEl, currentIngItem.marked);
      animateCard(ingSentenceEl);
    }

    function getForcedSentenceErrorVerdict() {
      if (recentSentenceErrorVerdicts.length < 3) return '';
      const lastThree = recentSentenceErrorVerdicts.slice(-3);
      return lastThree.every(verdict => verdict === lastThree[0])
        ? lastThree[0] === 'correct' ? 'incorrect' : 'correct'
        : '';
    }

    function pickSentenceErrorVariant(item, isReview) {
      const forcedVerdict = getForcedSentenceErrorVerdict();
      if (forcedVerdict && item.variants.includes(forcedVerdict)) return forcedVerdict;
      const previousVariant = sentenceErrorLastVariantById.get(item.id);
      const oppositeVariant = previousVariant === 'correct' ? 'incorrect' : 'correct';
      if (isReview && previousVariant && item.variants.includes(oppositeVariant)) return oppositeVariant;
      return item.variants[Math.floor(Math.random() * item.variants.length)];
    }

    function nextSentenceErrorItem() {
      if (!SENTENCE_ERROR_ITEMS.length) return false;
      const forcedVerdict = getForcedSentenceErrorVerdict();
      let selection;

      if (studyMode) {
        selection = getStudySelection(
          SENTENCE_ERROR_ITEMS,
          item => item.id,
          recentSentenceErrorIds
        );
      } else {
        const outsideCooldown = SENTENCE_ERROR_ITEMS.filter(item => !recentSentenceErrorIds.includes(item.id));
        let candidates = outsideCooldown.filter(item => item.correct !== lastSentenceErrorCorrect);
        if (!candidates.length) {
          candidates = SENTENCE_ERROR_ITEMS.filter(item => item.correct !== lastSentenceErrorCorrect);
        }
        if (!candidates.length) candidates = outsideCooldown.length ? outsideCooldown : SENTENCE_ERROR_ITEMS;
        if (forcedVerdict) {
          const balancedCandidates = candidates.filter(item => item.variants.includes(forcedVerdict));
          if (balancedCandidates.length) candidates = balancedCandidates;
        }
        const item = pickWeightedItem(candidates);
        selection = { item, id: item.id, isReview: false };
      }

      currentSentenceErrorItem = selection.item;
      currentStudyItemId = studyMode ? selection.id : '';
      currentStudyItemIsReview = studyMode && selection.isReview;
      currentSentenceErrorVariant = pickSentenceErrorVariant(currentSentenceErrorItem, currentStudyItemIsReview);
      sentenceErrorLastVariantById.set(currentSentenceErrorItem.id, currentSentenceErrorVariant);
      recentSentenceErrorIds.push(currentSentenceErrorItem.id);
      if (recentSentenceErrorIds.length > SENTENCE_ERROR_COOLDOWN) recentSentenceErrorIds.shift();
      recentSentenceErrorVerdicts.push(currentSentenceErrorVariant);
      if (recentSentenceErrorVerdicts.length > 3) recentSentenceErrorVerdicts.shift();
      if (!studyMode) lastSentenceErrorCorrect = currentSentenceErrorItem.correct;
      sentenceErrorSentenceEl.textContent = currentSentenceErrorItem[currentSentenceErrorVariant];
      animateCard(sentenceErrorSentenceEl);
      return true;
    }

    function startActivity(activity) {
      const screen = ACTIVITY_SCREENS[activity];

        showScreen(menuScreen);
        return;

      activeActivity = activity;
      score = 0;
      acceptingInput = false;
      resultModal.classList.remove('show');
      infoModal.classList.remove('show');
      studyExplanationModal.classList.remove('show');
      resetFlashFeedback();
      clearStreakCelebration();
      stopPrimeTimer();
      stopGrammarTimer();
      stopIngTimer();
      stopSentenceErrorTimer();
      clearAnswerFeedback(activity);
      sentenceErrorEmptyEl.hidden = true;
      currentStudyItemId = '';

      if (studyMode && STUDY_ACTIVITY_KEYS.has(activity)) studyState = loadStudyState();

      if (activity === 'prime') {
        primeScoreEl.textContent = '0';
        primeBestEl.textContent = getPlayerBest('prime');

        nextPrimeNumber();

        nextIngItem();
