<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#111318">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Quick Tap">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon-180.png">
  <link rel="apple-touch-icon" sizes="167x167" href="assets/icons/apple-touch-icon-167.png">
  <link rel="apple-touch-icon" sizes="152x152" href="assets/icons/apple-touch-icon-152.png">
  <title>Quick Tap</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #111318;
      color: #f7f8fa;
      -webkit-tap-highlight-color: transparent;
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; }
    body { min-height: 100dvh; background: #111318; touch-action: manipulation; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
    button, input, select { font: inherit; }
    button { color: inherit; }
    [hidden] { display: none !important; }

    .screen { position: absolute; inset: 0; min-height: 100dvh; }
    .screen:not(.active) { display: none; }

    .topbar {
      position: absolute;
      z-index: 8;
      top: calc(env(safe-area-inset-top) + 16px);
      left: 16px;
      right: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      pointer-events: none;
    }

    .topbar > * { pointer-events: auto; }
    .icon-button, .pill {
      min-height: 42px;
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 999px;
      background: rgba(17,19,24,.62);
      backdrop-filter: blur(10px);
      color: #fff;
    }
    .icon-button { padding: 0 15px; cursor: pointer; font-size: .82rem; font-weight: 800; }
    .pill { display: flex; align-items: baseline; gap: 7px; padding: 9px 13px; }
    .pill__label { color: rgba(255,255,255,.6); font-size: .66rem; font-weight: 800; letter-spacing: .08em; }
    .pill__value { font-size: 1.02rem; font-weight: 850; font-variant-numeric: tabular-nums; }
    .score-group { display: flex; gap: 7px; }

    .welcome, .menu {
      display: grid;
      place-items: center;
      padding: calc(env(safe-area-inset-top) + 26px) 22px calc(env(safe-area-inset-bottom) + 26px);
      overflow-y: auto;
      background:
        radial-gradient(circle at 18% 18%, rgba(75,205,168,.13), transparent 34%),
        radial-gradient(circle at 86% 78%, rgba(168,120,255,.12), transparent 34%),
        #111318;
    }

    .panel { width: min(100%, 520px); }
    .menu .panel { width: min(100%, 820px); }
    .brand { margin: 0 0 10px; color: #7bf0bf; font-size: .74rem; font-weight: 900; letter-spacing: .17em; }
    .welcome h1, .menu h1 { margin: 0; font-size: clamp(2.1rem, 9vw, 3.7rem); line-height: 1.04; letter-spacing: -.055em; }
    .subtitle { margin: 14px 0 28px; color: rgba(255,255,255,.62); line-height: 1.6; }
    .field-label { display: block; margin: 0 0 9px; color: rgba(255,255,255,.72); font-size: .82rem; font-weight: 800; }
    .select, .text-input {
      width: 100%;
      height: 56px;
      padding: 0 16px;
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 16px;
      outline: 0;
      background: #1b1e25;
      color: #fff;
    }
    .select:focus, .text-input:focus { border-color: #7bf0bf; box-shadow: 0 0 0 3px rgba(123,240,191,.12); }
    .text-input { margin-top: 10px; user-select: text; -webkit-user-select: text; }
    .primary-button, .secondary-button, .danger-button {
      width: 100%;
      min-height: 54px;
      border: 0;
      border-radius: 16px;
      cursor: pointer;
      font-weight: 850;
    }
    .primary-button { margin-top: 16px; background: #f3f5f7; color: #111318; }
    .secondary-button { border: 1px solid rgba(255,255,255,.14); background: #262a32; color: #fff; }
    .danger-button { border: 1px solid rgba(255,105,120,.27); background: rgba(255,73,91,.1); color: #ff9ba5; }
    .primary-button:active, .secondary-button:active, .icon-button:active, .activity-card:active { transform: scale(.985); }
    button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid #7bf0bf; outline-offset: 3px; }

    .menu__header { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin-bottom: 24px; }
    .activity-chip { display: inline-flex; margin-bottom: 18px; padding: 9px 13px; border-radius: 999px; background: #22262e; color: #7bf0bf; font-size: clamp(.78rem, 1.45vmin, 1rem); font-weight: 850; }
    .activity-list { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .activity-card {
      min-height: 210px;
      padding: 22px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 24px;
      text-align: left;
      cursor: pointer;
    }
    .activity-card--prime { background: linear-gradient(155deg, #226c5e, #163d36); }
    .activity-card--grammar { background: linear-gradient(155deg, #7250a5, #3d2d58); }
    .activity-card__icon { display: block; margin-bottom: 36px; font-size: clamp(2rem, 4vmin, 3rem); }
    .activity-card strong { display: block; font-size: clamp(1.35rem, 2.8vmin, 2rem); letter-spacing: -.03em; }
    .activity-card small { display: block; margin-top: 8px; color: rgba(255,255,255,.63); font-size: clamp(.8rem, 1.65vmin, 1.08rem); line-height: 1.45; }

    .game { overflow: hidden; }
    .choice { position: absolute; border: 0; cursor: pointer; transition: filter 100ms ease; }
    .choice:active { filter: brightness(1.17); }
    .choice__label { font-weight: 850; letter-spacing: -.02em; text-align: center; }
    .choice__hint { display: block; margin-top: 7px; color: rgba(255,255,255,.56); font-size: clamp(.68rem, 1.45vmin, 1rem); font-weight: 800; letter-spacing: .08em; }

    .prime-choice { left: 0; width: 100%; height: 50%; color: rgba(255,255,255,.76); }
    .prime-choice--yes { top: 0; padding-top: 100px; background: linear-gradient(160deg, #226c5e, #17483f); }
    .prime-choice--no { bottom: 0; padding-bottom: 72px; background: linear-gradient(160deg, #473346, #2d222e); }
    .prime-choice--yes .choice__label { position: absolute; top: calc(env(safe-area-inset-top) + 108px); left: 0; width: 100%; }
    .prime-choice--no .choice__label { position: absolute; bottom: calc(env(safe-area-inset-bottom) + 38px); left: 0; width: 100%; }
    .prime-choice .choice__label { font-size: clamp(1rem, calc(2vmin + .45rem), 1.85rem); }
    .prime-divider { position: absolute; z-index: 2; top: 50%; left: 7%; width: 86%; height: 1px; background: rgba(255,255,255,.14); pointer-events: none; }

    .game-timer {
      position: absolute;
      z-index: 9;
      top: calc(env(safe-area-inset-top) + 72px);
      left: 50%;
      width: min(48vw, 360px);
      transform: translateX(-50%);
      pointer-events: none;
    }
    .game-timer__meta { display: flex; justify-content: space-between; margin-bottom: 6px; color: rgba(255,255,255,.72); font-size: clamp(.67rem, 1.35vmin, .88rem); font-weight: 850; }
    .game-timer__track { height: clamp(7px, 1vmin, 11px); overflow: hidden; border: 1px solid rgba(255,255,255,.16); border-radius: 999px; background: rgba(17,19,24,.54); }
    .game-timer__bar { display: block; width: 100%; height: 100%; border-radius: inherit; background: #7bf0bf; transform-origin: left center; }
    .game-timer.urgent .game-timer__bar { background: #ff6575; }

    .center-card {
      position: absolute;
      z-index: 19;
      top: 50%;
      left: 50%;
      min-width: min(56vw, 230px);
      padding: 18px 28px 20px;
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 24px;
      background: rgba(17,19,24,.94);
      box-shadow: 0 18px 50px rgba(0,0,0,.35);
      transform: translate(-50%,-50%);
      text-align: center;
      pointer-events: none;
    }
    .number { font-size: clamp(4.5rem, 24vw, 7.5rem); font-weight: 850; line-height: .9; letter-spacing: -.07em; font-variant-numeric: tabular-nums; }
    .verb { min-width: min(62vw, 300px); padding-block: 22px 24px; font-size: clamp(2.4rem, 12vw, 4.6rem); font-weight: 850; line-height: 1; letter-spacing: -.055em; }
    .center-card.pop { animation: pop 170ms ease-out; }
    @keyframes pop { 0% { opacity: .25; transform: translate(-50%,-50%) scale(.83); } 100% { opacity: 1; transform: translate(-50%,-50%) scale(1); } }

    .grammar-grid { position: absolute; inset: 0; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
    .grammar-choice { position: relative; width: 100%; height: 100%; padding: 126px 12px 40px; color: rgba(255,255,255,.77); }
    .grammar-choice:nth-child(1) { background: #205f55; }
    .grammar-choice:nth-child(2) { background: #4e3d70; }
    .grammar-choice:nth-child(3) { padding-top: 70px; background: #644530; }
    .grammar-choice:nth-child(4) { padding-top: 70px; background: #3a526d; }
    .grammar-choice .choice__label { display: block; margin: auto; max-width: clamp(180px, 30vw, 350px); font-size: clamp(1.08rem, calc(2.4vmin + .55rem), 2.3rem); line-height: 1.22; }
    .grammar-lines::before, .grammar-lines::after { content: ""; position: absolute; z-index: 2; background: rgba(255,255,255,.16); pointer-events: none; }
    .grammar-lines::before { top: 7%; bottom: 7%; left: 50%; width: 1px; }
    .grammar-lines::after { top: 50%; left: 5%; right: 5%; height: 1px; }

    .flash { position: absolute; z-index: 12; inset: 0; opacity: 0; pointer-events: none; }
    .flash.correct { animation: correct 240ms ease-out; }
    .flash.wrong { animation: wrong 340ms ease-out; }
    @keyframes correct { 0% { opacity: .55; box-shadow: inset 0 0 0 8px #7bf0bf; } 100% { opacity: 0; box-shadow: inset 0 0 0 0 #7bf0bf; } }
    @keyframes wrong { 0%,45% { opacity: .65; background: rgba(255,73,91,.48); } 100% { opacity: 0; } }

    .choice.answer-correct { z-index: 4; filter: brightness(1.24); box-shadow: inset 0 0 0 clamp(6px, .9vmin, 11px) #8affcf; }
    .choice.answer-wrong { z-index: 4; filter: brightness(.8); box-shadow: inset 0 0 0 clamp(6px, .9vmin, 11px) #ff5264; }
    .answer-feedback {
      position: absolute;
      z-index: 18;
      top: 50%;
      left: 50%;
      min-width: min(72vw, 420px);
      padding: clamp(16px, 2.5vmin, 26px) clamp(24px, 4vmin, 42px);
      border: 3px solid transparent;
      border-radius: 24px;
      box-shadow: 0 18px 60px rgba(0,0,0,.45);
      opacity: 0;
      transform: translate(-50%,-50%) scale(.78);
      text-align: center;
      pointer-events: none;
    }
    .answer-feedback.show { animation: feedback-pop 650ms ease-out both; }
    .answer-feedback.correct { border-color: #8affcf; background: rgba(14,77,58,.97); color: #dffff2; }
    .answer-feedback.wrong { border-color: #ff6575; background: rgba(110,23,35,.97); color: #fff0f2; }
    .answer-feedback strong { display: block; font-size: clamp(1.65rem, 4.6vmin, 3rem); line-height: 1.05; }
    .answer-feedback span { display: block; margin-top: 7px; font-size: clamp(.78rem, 1.8vmin, 1.05rem); font-weight: 750; }
    @keyframes feedback-pop {
      0% { opacity: 0; transform: translate(-50%,-50%) scale(.78); }
      18%,78% { opacity: 1; transform: translate(-50%,-50%) scale(1); }
      100% { opacity: 0; transform: translate(-50%,-50%) scale(1.04); }
    }

    .modal {
      position: absolute;
      z-index: 30;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 22px;
      background: rgba(9,10,13,.84);
      backdrop-filter: blur(14px);
      opacity: 0;
      visibility: hidden;
      transition: opacity 180ms ease, visibility 180ms ease;
    }
    .modal.show { opacity: 1; visibility: visible; }
    .modal__card { width: min(100%, 420px); max-height: calc(100dvh - 44px); overflow-y: auto; padding: 28px 22px 22px; border: 1px solid rgba(255,255,255,.12); border-radius: 27px; background: #191c22; box-shadow: 0 24px 70px rgba(0,0,0,.4); text-align: center; }
    .modal__eyebrow { margin: 0 0 9px; color: #ff8793; font-size: .75rem; font-weight: 900; letter-spacing: .13em; }
    .modal__eyebrow.info { color: #7bf0bf; }
    .modal h2 { margin: 0; font-size: 2rem; letter-spacing: -.04em; }
    .modal__message { margin: 12px 0 20px; color: rgba(255,255,255,.7); font-size: .94rem; line-height: 1.65; white-space: pre-line; }
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-bottom: 18px; }
    .stat { padding: 14px; border-radius: 15px; background: #22262e; }
    .stat span { display: block; color: rgba(255,255,255,.54); font-size: .7rem; }
    .stat strong { display: block; margin-top: 4px; font-size: 1.55rem; }
    .leaderboard { margin: 0 0 16px; text-align: left; }
    .leaderboard__title { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
    .leaderboard h3 { margin: 0; font-size: .88rem; }
    .leaderboard__list { margin: 0; padding: 0; list-style: none; border-radius: 14px; overflow: hidden; background: #22262e; }
    .leaderboard__row { display: grid; grid-template-columns: 30px 1fr auto; gap: 8px; padding: 10px 13px; border-bottom: 1px solid rgba(255,255,255,.06); font-size: .84rem; }
    .leaderboard__row:last-child { border-bottom: 0; }
    .leaderboard__row.current { color: #7bf0bf; }
    .leaderboard__rank { color: rgba(255,255,255,.45); font-variant-numeric: tabular-nums; }
    .leaderboard__score { font-weight: 850; font-variant-numeric: tabular-nums; }
    .leaderboard__empty { padding: 15px; color: rgba(255,255,255,.45); text-align: center; font-size: .8rem; }
    .modal__actions { display: grid; gap: 9px; }
    .modal__actions .primary-button { margin-top: 0; }
    .link-button { margin-top: 13px; border: 0; background: transparent; color: rgba(255,255,255,.5); cursor: pointer; font-size: .78rem; text-decoration: underline; text-underline-offset: 3px; }
    .info-dismiss {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin: 0 0 18px;
      padding: 13px 14px;
      border-radius: 14px;
      background: #22262e;
      color: rgba(255,255,255,.76);
      text-align: left;
      font-size: .84rem;
      line-height: 1.45;
      cursor: pointer;
      user-select: none;
    }
    .info-dismiss input { flex: 0 0 auto; width: 19px; height: 19px; margin: 1px 0 0; accent-color: #7bf0bf; }

    @media (max-width: 390px) {
      .activity-list { grid-template-columns: 1fr; }
      .activity-card { min-height: 150px; }
      .activity-card__icon { margin-bottom: 20px; }
      .menu { place-items: start center; }
      .menu__header { margin-top: 28px; }
    }
    @media (max-width: 480px) {
      .topbar { left: 10px; right: 10px; gap: 7px; }
      .icon-button { min-height: 38px; padding: 0 11px; font-size: .74rem; }
      .pill { min-height: 38px; gap: 5px; padding: 7px 10px; }
      .pill__label { font-size: .58rem; }
      .pill__value { font-size: .94rem; }
      .score-group { gap: 5px; }
      .game-timer { width: min(46vw, 200px); }
    }
    @media (orientation: landscape) and (max-height: 600px) {
      .topbar { top: calc(env(safe-area-inset-top) + 8px); }
      .game-timer { top: calc(env(safe-area-inset-top) + 54px); width: min(34vw, 260px); }
      .grammar-choice { padding-top: 88px; }
      .grammar-choice:nth-child(3), .grammar-choice:nth-child(4) { padding-top: 42px; }
      .modal__card { padding-top: 22px; padding-bottom: 18px; }
    }
    @media (min-width: 900px) and (min-height: 650px) and (hover: hover) and (pointer: fine) {
      #info-modal .modal__card { width: min(100%, 620px); padding: 42px 42px 34px; border-radius: 32px; }
      #info-modal .modal__eyebrow { margin-bottom: 13px; font-size: .9rem; }
      #info-modal h2 { font-size: 2.8rem; }
      #info-modal .modal__message { margin: 18px 0 26px; font-size: 1.2rem; line-height: 1.75; }
      #info-modal .info-dismiss { padding: 16px 18px; font-size: 1rem; }
      #info-modal .primary-button { min-height: 62px; font-size: 1.08rem; }
    }
    @media (prefers-reduced-motion: reduce) { *,*::before,*::after { animation-duration: 1ms !important; transition-duration: 1ms !important; } }
  </style>
</head>
<body>
  <section class="screen welcome" id="welcome-screen" aria-labelledby="welcome-title">
    <form class="panel" id="name-form">
      <p class="brand">QUICK TAP</p>
      <span class="activity-chip" id="selected-activity-label"></span>
      <h1 id="welcome-title">플레이어를<br>선택하세요</h1>
      <p class="subtitle">이름별 최고 연속 정답 기록이 이 기기의 리더보드에 저장됩니다.</p>
      <label class="field-label" for="name-select">이름</label>
      <select class="select" id="name-select" required></select>
      <input class="text-input" id="custom-name" type="text" maxlength="20" autocomplete="name" placeholder="이름을 입력하세요" aria-label="직접 입력할 이름" hidden>
      <button class="primary-button" type="submit">시작하기</button>
    </form>
  </section>

  <section class="screen menu active" id="menu-screen" aria-labelledby="menu-title">
    <div class="panel">
      <div class="menu__header">
        <div>
          <p class="brand">CHOOSE ACTIVITY</p>
          <h1 id="menu-title">어떤 활동을<br>할까요?</h1>
        </div>
      </div>
      <div class="activity-list">
        <button class="activity-card activity-card--prime" type="button" data-start="prime">
          <span class="activity-card__icon">2, 3, 5</span>
          <strong>소수 판별</strong>
          <small>수를 보고 소수인지 빠르게 판단해요.</small>
        </button>
        <button class="activity-card activity-card--grammar" type="button" data-start="grammar">
          <span class="activity-card__icon">to / -ing</span>
          <strong>동사의 목적어</strong>
          <small>동명사와 to 부정사 쓰임을 네 영역에서 골라요.</small>
        </button>
      </div>
    </div>
  </section>

  <main class="screen game" id="prime-screen" aria-label="소수 판별 게임">
    <button class="choice prime-choice prime-choice--yes" type="button" data-prime-answer="prime">
      <span class="choice__label">소수 · PRIME<span class="choice__hint">↑</span></span>
    </button>
    <button class="choice prime-choice prime-choice--no" type="button" data-prime-answer="not-prime">
      <span class="choice__label">소수 아님 · NOT PRIME<span class="choice__hint">↓</span></span>
    </button>
    <div class="topbar">
      <button class="icon-button" type="button" data-change-player>← 이름 바꾸기</button>
      <div class="score-group">
        <div class="pill"><span class="pill__label">연속</span><span class="pill__value" id="prime-score">0</span></div>
        <div class="pill"><span class="pill__label">MY BEST</span><span class="pill__value" id="prime-best">0</span></div>
      </div>
    </div>
    <div class="game-timer" id="prime-timer" role="timer" aria-live="off">
      <div class="game-timer__meta"><span>남은 시간</span><strong id="prime-timer-label">2.0초</strong></div>
      <div class="game-timer__track"><span class="game-timer__bar" id="prime-timer-bar"></span></div>
    </div>
    <div class="prime-divider" aria-hidden="true"></div>
    <div class="center-card number" id="number" aria-live="assertive">2</div>
    <div class="flash" id="prime-flash" aria-hidden="true"></div>
    <div class="answer-feedback" id="prime-feedback" role="status" aria-live="assertive"><strong></strong><span></span></div>
  </main>

  <main class="screen game" id="grammar-screen" aria-label="동사의 목적어 분류 게임">
    <div class="grammar-grid grammar-lines">
      <button class="choice grammar-choice" type="button" data-grammar-answer="gerund"><span class="choice__label">동명사</span></button>
      <button class="choice grammar-choice" type="button" data-grammar-answer="infinitive"><span class="choice__label">to 부정사</span></button>
      <button class="choice grammar-choice" type="button" data-grammar-answer="both-same"><span class="choice__label">둘 다<br>(의미 차이 X)</span></button>
      <button class="choice grammar-choice" type="button" data-grammar-answer="both-different"><span class="choice__label">둘 다<br>(의미 차이 O)</span></button>
    </div>
    <div class="topbar">
      <button class="icon-button" type="button" data-change-player>← 이름 바꾸기</button>
      <div class="score-group">
        <div class="pill"><span class="pill__label">연속</span><span class="pill__value" id="grammar-score">0</span></div>
        <div class="pill"><span class="pill__label">MY BEST</span><span class="pill__value" id="grammar-best">0</span></div>
      </div>
    </div>
    <div class="game-timer" id="grammar-timer" role="timer" aria-live="off">
      <div class="game-timer__meta"><span>남은 시간</span><strong id="grammar-timer-label">5.0초</strong></div>
      <div class="game-timer__track"><span class="game-timer__bar" id="grammar-timer-bar"></span></div>
    </div>
    <div class="center-card verb" id="verb" aria-live="assertive">enjoy</div>
    <div class="flash" id="grammar-flash" aria-hidden="true"></div>
    <div class="answer-feedback" id="grammar-feedback" role="status" aria-live="assertive"><strong></strong><span></span></div>
  </main>

  <section class="modal" id="info-modal" role="dialog" aria-modal="true" aria-labelledby="info-title">
    <div class="modal__card">
      <p class="modal__eyebrow info">USAGE NOTE</p>
      <h2 id="info-title">기억해 두세요</h2>
      <p class="modal__message" id="info-message"></p>
      <label class="info-dismiss" for="hide-word-note">
        <input id="hide-word-note" type="checkbox">
        <span>이 단어에 대한 설명을 이번 라운드에서는 앞으로 띄우지 않음</span>
      </label>
      <button class="primary-button" id="info-continue" type="button">계속하기</button>
    </div>
  </section>

  <section class="modal" id="result-modal" role="dialog" aria-modal="true" aria-labelledby="result-title">
    <div class="modal__card">
      <p class="modal__eyebrow">ROUND OVER</p>
      <h2 id="result-title">아쉬워요!</h2>
      <p class="modal__message" id="result-message"></p>
      <div class="stats">
        <div class="stat"><span>이번 연속 기록</span><strong id="final-score">0</strong></div>
        <div class="stat"><span>나의 최고 기록</span><strong id="final-best">0</strong></div>
      </div>
      <div class="leaderboard">
        <div class="leaderboard__title"><h3 id="leaderboard-title">리더보드</h3></div>
        <ol class="leaderboard__list" id="leaderboard-list"></ol>
      </div>
      <div class="modal__actions">
        <button class="primary-button" id="restart" type="button">다시 시작</button>
        <button class="secondary-button" id="change-result-player" type="button">플레이어 바꾸기</button>
      </div>
      <button class="link-button" id="reset-leaderboard" type="button">이 활동 리더보드 초기화</button>
    </div>
  </section>

  <script>
    const PLAYER_NAMES = [
      '박범준', '배승우', '윤해든', '이룩', '이수민', '이우진', '이은수', '이지우',
      '임윤아', '채범기', '한지아', '가서연', '김경민', '김시아', '이은성', '황민호',
      '강용제', '김예승', '김재윤', '김하준', '박시현', '박이환', '백시율', '이해원',
      '조현우', '지수연', '황은찬'
    ].sort((a, b) => a.localeCompare(b, 'ko'));

    const VERBS = [
      ...['enjoy', 'finish', 'keep', 'stop', 'avoid', 'give up', 'mind', 'consider', 'put off'].map(verb => ({ verb, category: 'gerund' })),
      ...['want', 'decide', 'hope', 'expect', 'plan', 'ask', 'promise', 'refuse'].map(verb => ({ verb, category: 'infinitive' })),
      ...['like', 'love', 'hate', 'begin', 'dislike', 'start', 'continue'].map(verb => ({ verb, category: 'both-same' })),
      ...['remember', 'forget', 'try', 'regret'].map(verb => ({ verb, category: 'both-different' }))
    ];
    const VERB_COOLDOWN = 8;

    const CATEGORY_LABELS = {
      gerund: '동명사',
      infinitive: 'to 부정사',
      'both-same': '둘 다 (의미 차이 X)',
      'both-different': '둘 다 (의미 차이 O)'
    };

    const ACTIVITY_LABELS = {
      prime: '소수 판별',
      grammar: '동사의 목적어'
    };

    const USAGE_NOTES = {
      stop: 'stop + 동명사: 하던 일을 멈추다\nstop + to 부정사: 다른 일을 하기 위해 멈추다\n\n※ to 부정사도 쓸 수 있지만 이때는 목적어가 아니라 목적을 나타내며 의미가 달라집니다.',
      dislike: 'dislike는 동명사와 to 부정사를 모두 목적어로 쓸 수 있습니다.\n그러나 주로 동명사를 사용합니다.',
      remember: 'remember + 동명사: 과거에 한 일을 기억하다\nremember + to 부정사: 해야 할 일을 기억하고 하다',
      forget: 'forget + 동명사: 과거에 한 일을 잊다\nforget + to 부정사: 해야 할 일을 깜빡하다',
      try: 'try + 동명사: 시험 삼아 한번 해 보다\ntry + to 부정사: 애써 ~하려고 노력하다',
      regret: 'regret + 동명사: 과거에 한 일을 후회하다\nregret + to 부정사: 유감스럽게도 ~하게 되다(알리다·말하다)'
    };

    const screens = [...document.querySelectorAll('.screen')];
    const welcomeScreen = document.querySelector('#welcome-screen');
    const menuScreen = document.querySelector('#menu-screen');
    const primeScreen = document.querySelector('#prime-screen');
    const grammarScreen = document.querySelector('#grammar-screen');
    const nameForm = document.querySelector('#name-form');
    const nameSelect = document.querySelector('#name-select');
    const customNameInput = document.querySelector('#custom-name');
    const selectedActivityLabel = document.querySelector('#selected-activity-label');
    const numberEl = document.querySelector('#number');
    const verbEl = document.querySelector('#verb');
    const primeScoreEl = document.querySelector('#prime-score');
    const grammarScoreEl = document.querySelector('#grammar-score');
    const primeBestEl = document.querySelector('#prime-best');
    const grammarBestEl = document.querySelector('#grammar-best');
    const primeFlashEl = document.querySelector('#prime-flash');
    const grammarFlashEl = document.querySelector('#grammar-flash');
    const primeTimerEl = document.querySelector('#prime-timer');
    const primeTimerLabelEl = document.querySelector('#prime-timer-label');
    const primeTimerBarEl = document.querySelector('#prime-timer-bar');
    const grammarTimerEl = document.querySelector('#grammar-timer');
    const grammarTimerLabelEl = document.querySelector('#grammar-timer-label');
    const grammarTimerBarEl = document.querySelector('#grammar-timer-bar');
    const primeFeedbackEl = document.querySelector('#prime-feedback');
    const grammarFeedbackEl = document.querySelector('#grammar-feedback');
    const infoModal = document.querySelector('#info-modal');
    const infoTitleEl = document.querySelector('#info-title');
    const infoMessageEl = document.querySelector('#info-message');
    const hideWordNoteInput = document.querySelector('#hide-word-note');
    const infoContinueButton = document.querySelector('#info-continue');
    const resultModal = document.querySelector('#result-modal');
    const resultMessageEl = document.querySelector('#result-message');
    const finalScoreEl = document.querySelector('#final-score');
    const finalBestEl = document.querySelector('#final-best');
    const leaderboardTitleEl = document.querySelector('#leaderboard-title');
    const leaderboardListEl = document.querySelector('#leaderboard-list');
    const restartButton = document.querySelector('#restart');
    const changeResultPlayerButton = document.querySelector('#change-result-player');
    const resetLeaderboardButton = document.querySelector('#reset-leaderboard');

    let playerName = '';
    let activeActivity = '';
    let score = 0;
    let currentNumber = 2;
    let currentVerb = VERBS[0];
    let recentVerbs = [];
    let acceptingInput = false;
    let audioContext = null;
    let primeTimeoutId = null;
    let primeTickIntervalId = null;
    let primeTimerAnimationId = null;
    let primeDeadline = 0;
    let primeTimeLimit = 0;
    let grammarTimeoutId = null;
    let grammarTickIntervalId = null;
    let grammarTimerAnimationId = null;
    let grammarDeadline = 0;
    const suppressedUsageNotes = new Set();

    function showScreen(screen) {
      screens.forEach(item => item.classList.toggle('active', item === screen));
    }

    function populateNames() {
      nameSelect.innerHTML = '';
      const placeholder = new Option('이름을 선택하세요', '', true, true);
      placeholder.disabled = true;
      nameSelect.add(placeholder);
      PLAYER_NAMES.forEach(name => nameSelect.add(new Option(name, name)));
      nameSelect.add(new Option('직접 입력', '__custom__'));
    }

    function getLeaderboard(activity) {
      try {
        const value = JSON.parse(localStorage.getItem(`quick-tap-leaderboard-${activity}`));
        return value && typeof value === 'object' && !Array.isArray(value) ? value : {};
      } catch {
        return {};
      }
    }

    function saveLeaderboard(activity, leaderboard) {
      localStorage.setItem(`quick-tap-leaderboard-${activity}`, JSON.stringify(leaderboard));
    }

    function getPlayerBest(activity) {
      return Number(getLeaderboard(activity)[playerName]) || 0;
    }

    function recordScore(activity, newScore) {
      const leaderboard = getLeaderboard(activity);
      leaderboard[playerName] = Math.max(Number(leaderboard[playerName]) || 0, newScore);
      saveLeaderboard(activity, leaderboard);
      return leaderboard[playerName];
    }

    function renderLeaderboard(activity) {
      const rows = Object.entries(getLeaderboard(activity))
        .map(([name, value]) => [name, Number(value) || 0])
        .sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], 'ko'));

      leaderboardListEl.innerHTML = '';
      if (!rows.length) {
        const empty = document.createElement('li');
        empty.className = 'leaderboard__empty';
        empty.textContent = '아직 기록이 없습니다.';
        leaderboardListEl.append(empty);
        return;
      }

      rows.forEach(([name, value], index) => {
        const item = document.createElement('li');
        item.className = `leaderboard__row${name === playerName ? ' current' : ''}`;
        const rank = document.createElement('span');
        rank.className = 'leaderboard__rank';
        rank.textContent = String(index + 1);
        const player = document.createElement('span');
        player.textContent = name;
        const rowScore = document.createElement('span');
        rowScore.className = 'leaderboard__score';
        rowScore.textContent = `${value}개`;
        item.append(rank, player, rowScore);
        leaderboardListEl.append(item);
      });
    }

    function animateCard(element) {
      element.classList.remove('pop');
      void element.offsetWidth;
      element.classList.add('pop');
    }

    function showFlash(element, type) {
      element.className = 'flash';
      void element.offsetWidth;
      element.classList.add(type);
    }

    function prepareAudio() {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (!AudioContextClass) return null;
      if (!audioContext) audioContext = new AudioContextClass();
      if (audioContext.state === 'suspended') audioContext.resume();
      return audioContext;
    }

    function playFeedbackSound(type) {
      if (!prepareAudio()) return;
      const startTime = audioContext.currentTime;
      const toneSets = {
        correct: [
          { frequency: 523.25, delay: 0, duration: .13, volume: .13 },
          { frequency: 659.25, delay: .12, duration: .18, volume: .13 }
        ],
        wrong: [
          { frequency: 392, delay: 0, duration: .14, volume: .1 },
          { frequency: 293.66, delay: .13, duration: .2, volume: .1 }
        ],
        tick: [{ frequency: 880, delay: 0, duration: .045, volume: .055 }]
      };
      const tones = toneSets[type] || [];

      tones.forEach(tone => {
        const oscillator = audioContext.createOscillator();
        const gain = audioContext.createGain();
        const toneStart = startTime + tone.delay;
        const toneEnd = toneStart + tone.duration;
        oscillator.type = 'sine';
        oscillator.frequency.setValueAtTime(tone.frequency, toneStart);
        gain.gain.setValueAtTime(.0001, toneStart);
        gain.gain.exponentialRampToValueAtTime(tone.volume, toneStart + .018);
        gain.gain.exponentialRampToValueAtTime(.0001, toneEnd);
        oscillator.connect(gain);
        gain.connect(audioContext.destination);
        oscillator.start(toneStart);
        oscillator.stop(toneEnd);
      });
    }

    function resetFlashFeedback() {
      primeFlashEl.className = 'flash';
      grammarFlashEl.className = 'flash';
    }

    function stopPrimeTimer() {
      window.clearTimeout(primeTimeoutId);
      window.clearInterval(primeTickIntervalId);
      window.cancelAnimationFrame(primeTimerAnimationId);
      primeTimeoutId = null;
      primeTickIntervalId = null;
      primeTimerAnimationId = null;
    }

    function updatePrimeTimer() {
      const remaining = Math.max(0, primeDeadline - performance.now());
      const ratio = primeTimeLimit ? remaining / primeTimeLimit : 0;
      primeTimerBarEl.style.transform = `scaleX(${ratio})`;
      primeTimerLabelEl.textContent = `${(remaining / 1000).toFixed(1)}초`;
      primeTimerEl.classList.toggle('urgent', ratio <= .34);
      if (remaining > 0) primeTimerAnimationId = window.requestAnimationFrame(updatePrimeTimer);
    }

    function getPrimeExplanation() {
      if (isPrime(currentNumber)) return `${currentNumber}은(는) 소수입니다.`;
      if (currentNumber === 1) return '1은 소수도 합성수도 아니며, 소인수분해할 수 없습니다.';
      return `${currentNumber}은(는) 소수가 아닙니다.\n${currentNumber} = ${getPrimeFactors(currentNumber).join(' × ')}`;
    }

    function handlePrimeTimeout() {
      if (!acceptingInput || activeActivity !== 'prime') return;
      acceptingInput = false;
      stopPrimeTimer();
      playFeedbackSound('wrong');
      showFlash(primeFlashEl, 'wrong');
      showAnswerFeedback('prime', 'wrong', '✕ 시간 초과!', `정답: ${isPrime(currentNumber) ? '소수' : '소수 아님'}`, null);
      finishRound(`시간이 초과되었습니다.\n${getPrimeExplanation()}`);
    }

    function startPrimeTimer() {
      stopPrimeTimer();
      primeTimeLimit = currentNumber < 100 ? 2000 : 3000;
      primeDeadline = performance.now() + primeTimeLimit;
      primeTimerEl.classList.remove('urgent');
      primeTimerBarEl.style.transform = 'scaleX(1)';
      primeTimerLabelEl.textContent = `${(primeTimeLimit / 1000).toFixed(1)}초`;
      primeTimeoutId = window.setTimeout(handlePrimeTimeout, primeTimeLimit);
      primeTickIntervalId = window.setInterval(() => {
        if (performance.now() < primeDeadline - 100) playFeedbackSound('tick');
      }, 1000);
      primeTimerAnimationId = window.requestAnimationFrame(updatePrimeTimer);
    }

    function stopGrammarTimer() {
      window.clearTimeout(grammarTimeoutId);
      window.clearInterval(grammarTickIntervalId);
      window.cancelAnimationFrame(grammarTimerAnimationId);
      grammarTimeoutId = null;
      grammarTickIntervalId = null;
      grammarTimerAnimationId = null;
    }

    function updateGrammarTimer() {
      const remaining = Math.max(0, grammarDeadline - performance.now());
      const ratio = remaining / 5000;
      grammarTimerBarEl.style.transform = `scaleX(${ratio})`;
      grammarTimerLabelEl.textContent = `${(remaining / 1000).toFixed(1)}초`;
      grammarTimerEl.classList.toggle('urgent', ratio <= .34);
      if (remaining > 0) grammarTimerAnimationId = window.requestAnimationFrame(updateGrammarTimer);
    }

    function getCurrentUsageNote() {
      if (suppressedUsageNotes.has(currentVerb.verb)) return '';
      return USAGE_NOTES[currentVerb.verb] || '';
    }

    function handleGrammarTimeout() {
      if (!acceptingInput || activeActivity !== 'grammar') return;
      acceptingInput = false;
      stopGrammarTimer();
      playFeedbackSound('wrong');
      showFlash(grammarFlashEl, 'wrong');
      showAnswerFeedback('grammar', 'wrong', '✕ 시간 초과!', `정답: ${CATEGORY_LABELS[currentVerb.category]}`, null);
      const note = getCurrentUsageNote();
      finishRound(`시간이 초과되었습니다.\n${currentVerb.verb}의 정답은 ‘${CATEGORY_LABELS[currentVerb.category]}’입니다.${note ? `\n\n${note}` : ''}`);
    }

    function startGrammarTimer() {
      stopGrammarTimer();
      grammarDeadline = performance.now() + 5000;
      grammarTimerEl.classList.remove('urgent');
      grammarTimerBarEl.style.transform = 'scaleX(1)';
      grammarTimerLabelEl.textContent = '5.0초';
      grammarTimeoutId = window.setTimeout(handleGrammarTimeout, 5000);
      grammarTickIntervalId = window.setInterval(() => {
        if (performance.now() < grammarDeadline - 100) playFeedbackSound('tick');
      }, 1000);
      grammarTimerAnimationId = window.requestAnimationFrame(updateGrammarTimer);
    }

    function clearAnswerFeedback(activity) {
      const screen = activity === 'prime' ? primeScreen : grammarScreen;
      const feedback = activity === 'prime' ? primeFeedbackEl : grammarFeedbackEl;
      screen.querySelectorAll('.choice').forEach(button => button.classList.remove('answer-correct', 'answer-wrong'));
      feedback.className = 'answer-feedback';
    }

    function showAnswerFeedback(activity, type, title, detail, answer) {
      clearAnswerFeedback(activity);
      const screen = activity === 'prime' ? primeScreen : grammarScreen;
      const feedback = activity === 'prime' ? primeFeedbackEl : grammarFeedbackEl;
      const attribute = activity === 'prime' ? 'data-prime-answer' : 'data-grammar-answer';
      const selectedButton = answer ? screen.querySelector(`[${attribute}="${answer}"]`) : null;
      if (selectedButton) selectedButton.classList.add(type === 'correct' ? 'answer-correct' : 'answer-wrong');
      feedback.querySelector('strong').textContent = title;
      feedback.querySelector('span').textContent = detail;
      void feedback.offsetWidth;
      feedback.classList.add(type, 'show');
    }

    function isPrime(number) {
      if (number < 2) return false;
      if (number === 2) return true;
      if (number % 2 === 0) return false;
      for (let divisor = 3; divisor <= Math.sqrt(number); divisor += 2) {
        if (number % divisor === 0) return false;
      }
      return true;
    }

    function getPrimeFactors(number) {
      const factors = [];
      let remaining = number;
      for (let divisor = 2; divisor * divisor <= remaining; divisor += divisor === 2 ? 1 : 2) {
        while (remaining % divisor === 0) {
          factors.push(divisor);
          remaining /= divisor;
        }
      }
      if (remaining > 1) factors.push(remaining);
      return factors;
    }

    function nextPrimeNumber() {
      let next;
      do { next = Math.floor(Math.random() * 299) + 1; } while (next === currentNumber);
      currentNumber = next;
      numberEl.textContent = currentNumber;
      animateCard(numberEl);
    }

    function nextVerb() {
      const availableVerbs = VERBS.filter(item => !recentVerbs.includes(item.verb));
      const next = availableVerbs[Math.floor(Math.random() * availableVerbs.length)];
      currentVerb = next;
      recentVerbs.push(currentVerb.verb);
      if (recentVerbs.length > VERB_COOLDOWN) recentVerbs.shift();
      verbEl.textContent = currentVerb.verb;
      animateCard(verbEl);
    }

    function startActivity(activity) {
      activeActivity = activity;
      score = 0;
      acceptingInput = false;
      resultModal.classList.remove('show');
      infoModal.classList.remove('show');
      resetFlashFeedback();
      stopPrimeTimer();
      stopGrammarTimer();
      clearAnswerFeedback(activity);

      if (activity === 'prime') {
        primeScoreEl.textContent = '0';
        primeBestEl.textContent = getPlayerBest('prime');
        showScreen(primeScreen);
        nextPrimeNumber();
      } else {
        suppressedUsageNotes.clear();
        grammarScoreEl.textContent = '0';
        grammarBestEl.textContent = getPlayerBest('grammar');
        showScreen(grammarScreen);
        nextVerb();
      }
      window.setTimeout(() => {
        acceptingInput = true;
        if (activity === 'prime') startPrimeTimer();
        if (activity === 'grammar') startGrammarTimer();
      }, 160);
    }

    function finishRound(message, delay = 720) {
      acceptingInput = false;
      stopPrimeTimer();
      stopGrammarTimer();
      const best = recordScore(activeActivity, score);
      finalScoreEl.textContent = score;
      finalBestEl.textContent = best;
      resultMessageEl.textContent = message;
      leaderboardTitleEl.textContent = activeActivity === 'prime' ? '소수 판별 리더보드' : '동사의 목적어 리더보드';
      renderLeaderboard(activeActivity);
      window.setTimeout(() => {
        resultModal.classList.add('show');
        restartButton.focus();
      }, delay);
    }

    function choosePrime(answer) {
      if (!acceptingInput || activeActivity !== 'prime') return;
      acceptingInput = false;
      stopPrimeTimer();
      const correct = isPrime(currentNumber);
      if (answer === (correct ? 'prime' : 'not-prime')) {
        playFeedbackSound('correct');
        score += 1;
        primeScoreEl.textContent = score;
        primeBestEl.textContent = Math.max(score, getPlayerBest('prime'));
        showFlash(primeFlashEl, 'correct');
        showAnswerFeedback('prime', 'correct', '✓ 정답!', `연속 ${score}개`, answer);
        window.setTimeout(() => {
          clearAnswerFeedback('prime');
          nextPrimeNumber();
          acceptingInput = true;
          startPrimeTimer();
        }, 650);
        return;
      }

      playFeedbackSound('wrong');
      showFlash(primeFlashEl, 'wrong');
      showAnswerFeedback('prime', 'wrong', '✕ 오답!', `정답: ${correct ? '소수' : '소수 아님'}`, answer);
      finishRound(getPrimeExplanation());
    }

    function showUsageNote() {
      infoTitleEl.textContent = currentVerb.verb;
      infoMessageEl.textContent = USAGE_NOTES[currentVerb.verb];
      hideWordNoteInput.checked = false;
      infoModal.classList.add('show');
      infoContinueButton.focus();
    }

    function chooseGrammar(answer) {
      if (!acceptingInput || activeActivity !== 'grammar') return;
      acceptingInput = false;
      stopGrammarTimer();
      if (answer === currentVerb.category) {
        playFeedbackSound('correct');
        score += 1;
        grammarScoreEl.textContent = score;
        grammarBestEl.textContent = Math.max(score, getPlayerBest('grammar'));
        showFlash(grammarFlashEl, 'correct');
        showAnswerFeedback('grammar', 'correct', '✓ 정답!', CATEGORY_LABELS[currentVerb.category], answer);
        if (getCurrentUsageNote()) {
          window.setTimeout(() => {
            clearAnswerFeedback('grammar');
            showUsageNote();
          }, 650);
        } else {
          window.setTimeout(() => {
            clearAnswerFeedback('grammar');
            nextVerb();
            acceptingInput = true;
            startGrammarTimer();
          }, 650);
        }
        return;
      }

      playFeedbackSound('wrong');
      showFlash(grammarFlashEl, 'wrong');
      showAnswerFeedback('grammar', 'wrong', '✕ 오답!', `정답: ${CATEGORY_LABELS[currentVerb.category]}`, answer);
      const usageNote = getCurrentUsageNote();
      const note = usageNote ? `\n\n${usageNote}` : '';
      finishRound(`${currentVerb.verb}의 정답은 ‘${CATEGORY_LABELS[currentVerb.category]}’입니다.${note}`);
    }

    function chooseActivity(activity) {
      activeActivity = activity;
      selectedActivityLabel.textContent = ACTIVITY_LABELS[activity];
      showScreen(welcomeScreen);
      window.setTimeout(() => nameSelect.focus(), 0);
    }

    function changePlayer() {
      acceptingInput = false;
      stopPrimeTimer();
      stopGrammarTimer();
      resultModal.classList.remove('show');
      infoModal.classList.remove('show');
      clearAnswerFeedback(activeActivity);
      selectedActivityLabel.textContent = ACTIVITY_LABELS[activeActivity];
      showScreen(welcomeScreen);
      window.setTimeout(() => nameSelect.focus(), 0);
    }

    populateNames();
    const previousPlayer = localStorage.getItem('quick-tap-last-player');
    if (previousPlayer) {
      if (PLAYER_NAMES.includes(previousPlayer)) {
        nameSelect.value = previousPlayer;
      } else {
        nameSelect.value = '__custom__';
        customNameInput.hidden = false;
        customNameInput.required = true;
        customNameInput.value = previousPlayer;
      }
    }

    nameSelect.addEventListener('change', () => {
      const isCustom = nameSelect.value === '__custom__';
      customNameInput.hidden = !isCustom;
      customNameInput.required = isCustom;
      if (isCustom) customNameInput.focus();
    });

    nameForm.addEventListener('submit', event => {
      event.preventDefault();
      const chosenName = nameSelect.value === '__custom__' ? customNameInput.value.trim() : nameSelect.value;
      if (!chosenName) {
        customNameInput.focus();
        return;
      }
      playerName = chosenName.slice(0, 20);
      localStorage.setItem('quick-tap-last-player', playerName);
      prepareAudio();
      startActivity(activeActivity);
    });

    document.querySelectorAll('[data-start]').forEach(button => button.addEventListener('click', () => chooseActivity(button.dataset.start)));
    document.querySelectorAll('[data-change-player]').forEach(button => button.addEventListener('click', changePlayer));
    document.querySelectorAll('[data-prime-answer]').forEach(button => {
      button.addEventListener('pointerdown', event => { event.preventDefault(); choosePrime(button.dataset.primeAnswer); });
    });
    document.querySelectorAll('[data-grammar-answer]').forEach(button => {
      button.addEventListener('pointerdown', event => { event.preventDefault(); chooseGrammar(button.dataset.grammarAnswer); });
    });

    infoContinueButton.addEventListener('click', () => {
      if (hideWordNoteInput.checked) suppressedUsageNotes.add(currentVerb.verb);
      infoModal.classList.remove('show');
      nextVerb();
      window.setTimeout(() => {
        acceptingInput = true;
        startGrammarTimer();
      }, 140);
    });

    restartButton.addEventListener('click', () => startActivity(activeActivity));
    changeResultPlayerButton.addEventListener('click', changePlayer);
    resetLeaderboardButton.addEventListener('click', () => {
      const label = activeActivity === 'prime' ? '소수 판별' : '동사의 목적어';
      if (!window.confirm(`${label} 리더보드의 모든 기록을 지울까요?`)) return;
      localStorage.removeItem(`quick-tap-leaderboard-${activeActivity}`);
      renderLeaderboard(activeActivity);
      finalBestEl.textContent = '0';
      if (activeActivity === 'prime') primeBestEl.textContent = '0';
      else grammarBestEl.textContent = '0';
      startActivity(activeActivity);
    });

    document.addEventListener('keydown', event => {
      if (resultModal.classList.contains('show')) return;
      if (infoModal.classList.contains('show')) {
        if (event.key === 'Enter' && document.activeElement !== hideWordNoteInput) {
          event.preventDefault();
          infoContinueButton.click();
        }
        return;
      }
      if (activeActivity === 'prime') {
        if (event.key === 'ArrowUp') choosePrime('prime');
        if (event.key === 'ArrowDown') choosePrime('not-prime');
      }
    });

    document.addEventListener('contextmenu', event => event.preventDefault());
  </script>
</body>
</html>
