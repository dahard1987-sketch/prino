<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#384959">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Quick Tap">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon-180.png">
  <link rel="apple-touch-icon" sizes="167x167" href="assets/icons/apple-touch-icon-167.png">
  <link rel="apple-touch-icon" sizes="152x152" href="assets/icons/apple-touch-icon-152.png">
  <title>Quick Tap</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <section class="screen welcome" id="welcome-screen" aria-labelledby="welcome-title">
    <form class="panel" id="name-form">
      <button class="icon-button welcome__back" id="back-to-activities" type="button">← 활동 다시 고르기</button>
      <p class="brand">QUICK TAP</p>
      <span class="activity-chip" id="selected-activity-label"></span>
      <h1 id="welcome-title">플레이어를<br>선택하세요</h1>
      <label class="field-label" for="name-select">이름</label>
      <select class="select" id="name-select" required></select>
      <input class="text-input" id="custom-name" type="text" maxlength="20" autocomplete="name" placeholder="이름을 입력하세요" aria-label="직접 입력할 이름" hidden>
      <label class="study-option" id="study-mode-option" for="study-mode-input" hidden>
        <input id="study-mode-input" type="checkbox">
        <strong>학습 모드</strong>
      </label>
      <button class="primary-button" type="submit">시작하기</button>
    </form>
  </section>

  <section class="screen menu active" id="menu-screen" aria-label="Quick Tap 활동 선택">
    <div class="panel">
      <header class="menu-masthead" aria-hidden="true">
        <p class="menu-wordmark"><span>QUICK</span><span>TAP</span></p>
      </header>
      <div class="activity-list">
        <button class="activity-card activity-card--prime" type="button" data-start="prime" hidden>
          <span class="activity-card__icon">2, 3, 5</span>
          <strong>소수 판별</strong>
        </button>
        <button class="activity-card activity-card--grammar" type="button" data-start="grammar">
          <span class="activity-card__icon">to / -ing</span>
          <strong>동사의 목적어</strong>
        </button>
        <button class="activity-card activity-card--ing" type="button" data-start="ing">
          <span class="activity-card__icon">G / P</span>
          <strong>동명사 / 현재분사</strong>
        </button>
        <button class="activity-card activity-card--sentence-error" id="sentence-error-start" type="button" data-start="sentence-error">
          <span class="activity-card__icon">✓ / ✕</span>
          <strong>문장 오류 찾기</strong>
        </button>
        <button class="activity-card activity-card--to-i" type="button" data-start="to-infinitive-i">
          <span class="activity-card__icon">n.? adj.? ad.?</span>
          <strong>to v. 용법 구분 I</strong>
        </button>
        <button class="activity-card activity-card--to-ii" type="button" data-start="to-infinitive-ii">
          <span class="activity-card__icon">to v. → ?</span>
          <strong>to v. 용법 구분 II</strong>
        </button>
        <button class="activity-card activity-card--preposition" id="preposition-start" type="button" data-start="participle-preposition">
          <span class="activity-card__icon">-ed + ?</span>
          <strong>분사 + 전치사</strong>
        </button>
        <button class="activity-card activity-card--hepta" type="button" data-start="sentence-building">
          <span class="activity-card__icon">A · B · C</span>
          <strong>(Hepta) Sentence Building</strong>
        </button>
      </div>
    </div>
  </section>

  <main class="screen game" id="prime-screen" aria-label="소수 판별 게임">
    <button class="choice prime-choice prime-choice--yes" type="button" data-prime-answer="prime" aria-label="소수, Prime Number">
      <span class="choice__label">소수 · Prime Number<span class="choice__hint">↑</span></span>
    </button>
    <button class="choice prime-choice prime-choice--no" type="button" data-prime-answer="not-prime" aria-label="합성수, Composite Number">
      <span class="choice__label">합성수 · Composite Number<span class="choice__hint">↓</span></span>
    </button>
    <div class="topbar">
      <button class="icon-button" type="button" data-change-player><span class="button-label--wide">← 이름 바꾸기</span><span class="button-label--short">← 이름</span></button>
      <div class="score-group">
        <div class="pill"><span class="pill__label">연속</span><span class="pill__value" id="prime-score">0</span></div>
        <div class="pill"><span class="pill__label">최고</span><span class="pill__value" id="prime-best">0</span></div>
      </div>
    </div>
    <div class="game-timer" id="prime-timer" role="timer" aria-live="off">
      <div class="game-timer__meta"><span>남은 시간</span><strong id="prime-timer-label">2.0초</strong></div>
      <div class="game-timer__track"><span class="game-timer__bar" id="prime-timer-bar"></span></div>
    </div>
    <div class="prime-divider" aria-hidden="true"></div>
    <div class="center-card number" id="number" aria-live="assertive">2</div>
    <div class="flash" id="prime-flash" aria-hidden="true"></div>
    <div class="answer-feedback" id="prime-feedback" role="status" aria-live="assertive"><strong></strong><span></span></div>
  </main>

  <main class="screen game" id="grammar-screen" aria-label="동사의 목적어 분류 게임">
    <div class="grammar-grid grammar-lines">
      <button class="choice grammar-choice" type="button" data-grammar-answer="gerund" aria-label="1번, 동명사"><kbd class="choice-key" aria-hidden="true">1</kbd><span class="choice__label">동명사</span></button>
      <button class="choice grammar-choice" type="button" data-grammar-answer="infinitive" aria-label="2번, to 부정사"><kbd class="choice-key" aria-hidden="true">2</kbd><span class="choice__label">to 부정사</span></button>
      <button class="choice grammar-choice" type="button" data-grammar-answer="both-same" aria-label="3번, 둘 다 의미 차이 없음"><kbd class="choice-key" aria-hidden="true">3</kbd><span class="choice__label">둘 다<br>(의미 차이 X)</span></button>
      <button class="choice grammar-choice" type="button" data-grammar-answer="both-different" aria-label="4번, 둘 다 의미 차이 있음"><kbd class="choice-key" aria-hidden="true">4</kbd><span class="choice__label">둘 다<br>(의미 차이 O)</span></button>
    </div>
    <div class="topbar">
      <div class="topbar__actions">
        <button class="icon-button" type="button" data-change-player><span class="button-label--wide">← 이름 바꾸기</span><span class="button-label--short">← 이름</span></button>
        <button class="icon-button study-toggle" type="button" data-study-toggle aria-pressed="false">학습 모드</button>
      </div>
      <div class="score-group">
        <div class="pill"><span class="pill__label" id="grammar-score-label">연속</span><span class="pill__value" id="grammar-score">0</span></div>
        <div class="pill"><span class="pill__label" id="grammar-best-label">최고</span><span class="pill__value" id="grammar-best">0</span></div>
      </div>
    </div>
    <div class="game-timer" id="grammar-timer" role="timer" aria-live="off">
      <div class="game-timer__meta"><span>남은 시간</span><strong id="grammar-timer-label">5.0초</strong></div>
      <div class="game-timer__track"><span class="game-timer__bar" id="grammar-timer-bar"></span></div>
    </div>
    <div class="center-card verb" id="verb" aria-live="assertive">enjoy</div>
    <div class="flash" id="grammar-flash" aria-hidden="true"></div>
    <div class="answer-feedback" id="grammar-feedback" role="status" aria-live="assertive"><strong></strong><span></span></div>
  </main>

  <main class="screen game" id="ing-screen" aria-label="동명사와 현재분사 판단 게임">
    <button class="choice ing-choice ing-choice--gerund" type="button" data-ing-answer="gerund" aria-label="동명사, Gerund">
      <span class="choice__label">동명사(Gerund)<span class="choice__hint">↑</span></span>
    </button>
    <button class="choice ing-choice ing-choice--participle" type="button" data-ing-answer="participle" aria-label="현재분사, Participle">
      <span class="choice__label">현재분사(Participle)<span class="choice__hint">↓</span></span>
    </button>
    <div class="topbar">
      <div class="topbar__actions">
        <button class="icon-button" type="button" data-change-player><span class="button-label--wide">← 이름 바꾸기</span><span class="button-label--short">← 이름</span></button>
        <button class="icon-button study-toggle" type="button" data-study-toggle aria-pressed="false">학습 모드</button>
      </div>
      <div class="score-group">
        <div class="pill"><span class="pill__label" id="ing-score-label">연속</span><span class="pill__value" id="ing-score">0</span></div>
        <div class="pill"><span class="pill__label" id="ing-best-label">최고</span><span class="pill__value" id="ing-best">0</span></div>
      </div>
    </div>
    <div class="game-timer" id="ing-timer" role="timer" aria-live="off">
      <div class="game-timer__meta"><span>남은 시간</span><strong id="ing-timer-label">7.0초</strong></div>
      <div class="game-timer__track"><span class="game-timer__bar" id="ing-timer-bar"></span></div>
    </div>
    <div class="prime-divider" aria-hidden="true"></div>
    <div class="center-card ing-sentence" id="ing-sentence" aria-live="assertive"></div>
    <div class="flash" id="ing-flash" aria-hidden="true"></div>
    <div class="answer-feedback" id="ing-feedback" role="status" aria-live="assertive"><strong></strong><span></span></div>
  </main>

  <main class="screen game" id="sentence-error-screen" aria-label="문장 오류 찾기 게임">
    <button class="choice sentence-error-choice sentence-error-choice--correct" type="button" data-sentence-error-answer="correct" aria-label="2번, 맞음"></button>
    <button class="choice sentence-error-choice sentence-error-choice--incorrect" type="button" data-sentence-error-answer="incorrect" aria-label="1번, 틀림"></button>
    <div class="topbar">
      <div class="topbar__actions">
        <button class="icon-button" type="button" data-change-player><span class="button-label--wide">← 이름 바꾸기</span><span class="button-label--short">← 이름</span></button>
        <button class="icon-button study-toggle" type="button" data-study-toggle aria-pressed="false">학습 모드</button>
      </div>
      <div class="score-group">
        <div class="pill"><span class="pill__label" id="sentence-error-score-label">연속</span><span class="pill__value" id="sentence-error-score">0</span></div>
        <div class="pill"><span class="pill__label" id="sentence-error-best-label">최고</span><span class="pill__value" id="sentence-error-best">0</span></div>
      </div>
    </div>
    <div class="game-timer" id="sentence-error-timer" role="timer" aria-live="off">
      <div class="game-timer__meta"><span>남은 시간</span><strong id="sentence-error-timer-label">10.0초</strong></div>
      <div class="game-timer__track"><span class="game-timer__bar" id="sentence-error-timer-bar"></span></div>
    </div>
    <div class="sentence-error-divider" aria-hidden="true"></div>
    <div class="sentence-error-guides" aria-hidden="true">
      <span class="sentence-error-guide sentence-error-guide__incorrect">틀림</span>
      <span class="sentence-error-guide sentence-error-guide__correct">맞음</span>
    </div>
    <div class="sentence-error-stage">
      <div class="center-card sentence-error-card" id="sentence-error-sentence" aria-live="assertive"></div>
    </div>
    <div class="sentence-error-empty" id="sentence-error-empty" hidden>
      <p>등록된 문장 오류 문제가 없습니다.</p>
      <button class="secondary-button" id="sentence-error-empty-back" type="button">활동 선택으로</button>
    </div>
    <div class="flash" id="sentence-error-flash" aria-hidden="true"></div>
    <div class="answer-feedback" id="sentence-error-feedback" role="status" aria-live="assertive"><strong></strong><span></span></div>
  </main>

  <main class="screen game radial-game radial-game--three" id="to-infinitive-i-screen" aria-label="to 부정사 용법 구분 1 게임">
    <button class="choice radial-choice radial-choice--i-noun" type="button" data-to-i-answer="noun" aria-label="1번, 명사적 용법">
      <span class="radial-choice__label"><kbd>1</kbd><strong>명사적</strong><small>n.</small></span>
    </button>
    <button class="choice radial-choice radial-choice--i-adjective" type="button" data-to-i-answer="adjective" aria-label="2번, 형용사적 용법">
      <span class="radial-choice__label"><kbd>2</kbd><strong>형용사적</strong><small>adj.</small></span>
    </button>
    <button class="choice radial-choice radial-choice--i-adverb" type="button" data-to-i-answer="adverb" aria-label="3번, 부사적 용법">
      <span class="radial-choice__label"><kbd>3</kbd><strong>부사적</strong><small>ad.</small></span>
    </button>
    <svg class="radial-seams" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true" focusable="false">
      <line x1="50" y1="52" x2="0" y2="0"></line>
      <line x1="50" y1="52" x2="100" y2="0"></line>
      <line x1="50" y1="52" x2="50" y2="100"></line>
    </svg>
    <div class="topbar">
      <div class="topbar__actions">
        <button class="icon-button" type="button" data-change-player><span class="button-label--wide">← 이름 바꾸기</span><span class="button-label--short">← 이름</span></button>
        <button class="icon-button study-toggle" type="button" data-study-toggle aria-pressed="false">학습 모드</button>
      </div>
      <div class="score-group">
        <div class="pill"><span class="pill__label" id="to-i-score-label">연속</span><span class="pill__value" id="to-i-score">0</span></div>
        <div class="pill"><span class="pill__label" id="to-i-best-label">최고</span><span class="pill__value" id="to-i-best">0</span></div>
      </div>
    </div>
    <div class="game-timer radial-timer" id="to-i-timer" role="timer" aria-live="off">
      <div class="game-timer__meta"><span>남은 시간</span><strong id="to-i-timer-label">10.0초</strong></div>
      <div class="game-timer__track"><span class="game-timer__bar" id="to-i-timer-bar"></span></div>
    </div>
    <div class="center-card to-infinitive-sentence" id="to-i-sentence" aria-live="assertive"></div>
    <div class="flash" id="to-i-flash" aria-hidden="true"></div>
    <div class="answer-feedback" id="to-i-feedback" role="status" aria-live="assertive"><strong></strong><span></span></div>
  </main>

  <main class="screen game radial-game radial-game--six" id="to-infinitive-ii-screen" aria-label="to 부정사 용법 구분 2 게임">
    <button class="choice radial-choice radial-choice--ii-purpose" type="button" data-to-ii-answer="purpose" aria-label="1번, 목적">
      <span class="radial-choice__label"><kbd>1</kbd><strong>목적</strong><small>...하기 위해서</small></span>
    </button>
    <button class="choice radial-choice radial-choice--ii-emotion" type="button" data-to-ii-answer="emotion" aria-label="2번, 감정의 원인">
      <span class="radial-choice__label"><kbd>2</kbd><strong>감정의 원인</strong><small>...해서</small></span>
    </button>
    <button class="choice radial-choice radial-choice--ii-judgment" type="button" data-to-ii-answer="judgment" aria-label="3번, 판단의 근거">
      <span class="radial-choice__label"><kbd>3</kbd><strong>판단의 근거</strong><small>...하다니</small></span>
    </button>
    <button class="choice radial-choice radial-choice--ii-result" type="button" data-to-ii-answer="result" aria-label="4번, 결과">
      <span class="radial-choice__label"><kbd>4</kbd><strong>결과</strong><small>결국 ...하게 되다</small></span>
    </button>
    <button class="choice radial-choice radial-choice--ii-adjective" type="button" data-to-ii-answer="adjective-modifier" aria-label="5번, 형용사 수식">
      <span class="radial-choice__label"><kbd>5</kbd><strong>형용사 수식</strong><small>...하기에</small></span>
    </button>
    <button class="choice radial-choice radial-choice--ii-condition" type="button" data-to-ii-answer="condition" aria-label="6번, 조건">
      <span class="radial-choice__label"><kbd>6</kbd><strong>조건</strong><small>...한다면</small></span>
    </button>
    <svg class="radial-seams" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true" focusable="false">
      <line x1="50" y1="52" x2="20" y2="0"></line>
      <line x1="50" y1="52" x2="80" y2="0"></line>
      <line x1="50" y1="52" x2="100" y2="60"></line>
      <line x1="50" y1="52" x2="50" y2="100"></line>
      <line x1="50" y1="52" x2="0" y2="60"></line>
      <line x1="50" y1="52" x2="0" y2="0"></line>
    </svg>
    <div class="topbar">
      <div class="topbar__actions">
        <button class="icon-button" type="button" data-change-player><span class="button-label--wide">← 이름 바꾸기</span><span class="button-label--short">← 이름</span></button>
        <button class="icon-button study-toggle" type="button" data-study-toggle aria-pressed="false">학습 모드</button>
      </div>
      <div class="score-group">
        <div class="pill"><span class="pill__label" id="to-ii-score-label">연속</span><span class="pill__value" id="to-ii-score">0</span></div>
        <div class="pill"><span class="pill__label" id="to-ii-best-label">최고</span><span class="pill__value" id="to-ii-best">0</span></div>
      </div>
    </div>
    <div class="game-timer radial-timer" id="to-ii-timer" role="timer" aria-live="off">
      <div class="game-timer__meta"><span>남은 시간</span><strong id="to-ii-timer-label">15.0초</strong></div>
      <div class="game-timer__track"><span class="game-timer__bar" id="to-ii-timer-bar"></span></div>
    </div>
    <div class="center-card to-infinitive-sentence" id="to-ii-sentence" aria-live="assertive"></div>
    <div class="flash" id="to-ii-flash" aria-hidden="true"></div>
    <div class="answer-feedback" id="to-ii-feedback" role="status" aria-live="assertive"><strong></strong><span></span></div>
  </main>

  <main class="screen game sentence-builder" id="sentence-building-screen" aria-label="Hepta 문장 만들기 게임">
    <div class="topbar">
      <div class="topbar__actions">
        <button class="icon-button" type="button" data-change-player><span class="button-label--wide">← 이름 바꾸기</span><span class="button-label--short">← 이름</span></button>
        <button class="icon-button study-toggle" type="button" data-study-toggle aria-pressed="false">학습 모드</button>
      </div>
      <div class="score-group">
        <div class="pill"><span class="pill__label" id="builder-score-label">연속</span><span class="pill__value" id="builder-score">0</span></div>
        <div class="pill"><span class="pill__label" id="builder-best-label">최고</span><span class="pill__value" id="builder-best">0</span></div>
      </div>
    </div>
    <div class="game-timer builder-timer" id="builder-timer" role="timer" aria-live="off">
      <div class="game-timer__meta"><span>남은 시간</span><strong id="builder-timer-label">15.0초</strong></div>
      <div class="game-timer__track"><span class="game-timer__bar" id="builder-timer-bar"></span></div>
    </div>
    <div class="builder-stage">
      <section class="builder-board" data-size="standard" aria-label="문장 만들기 판">
        <div class="builder-answer" id="builder-answer" aria-live="polite"></div>
        <div class="builder-bank" id="builder-bank"></div>
      </section>
      <div class="builder-actions">
        <button class="builder-action" id="builder-undo" type="button" aria-label="하나 되돌리기" title="하나 되돌리기" disabled>↶</button>
        <button class="builder-action builder-action--reset" id="builder-reset" type="button" aria-label="처음부터" title="처음부터" disabled>↺</button>
      </div>
    </div>
    <div class="flash" id="builder-flash" aria-hidden="true"></div>
    <div class="answer-feedback" id="builder-feedback" role="status" aria-live="assertive"><strong></strong><span></span></div>
    <audio id="builder-bgm" src="assets/audio/hepta-bg.mp3" preload="none" loop></audio>
    <audio id="builder-bgm-intense" src="assets/audio/hepta-rising-dread.mp3" preload="none" loop></audio>
  </main>

  <main class="screen game preposition-game" id="participle-preposition-screen" aria-label="분사와 전치사 조합 연습">
    <div class="preposition-choices preposition-lines" id="preposition-choices" aria-label="전치사 선택지">
      <button class="choice preposition-choice" type="button"><kbd>1</kbd><span></span></button>
      <button class="choice preposition-choice" type="button"><kbd>2</kbd><span></span></button>
      <button class="choice preposition-choice" type="button"><kbd>3</kbd><span></span></button>
      <button class="choice preposition-choice" type="button"><kbd>4</kbd><span></span></button>
    </div>
    <div class="topbar">
      <button class="icon-button" type="button" data-change-player><span class="button-label--wide">← 이름 바꾸기</span><span class="button-label--short">← 이름</span></button>
      <div class="score-group">
        <div class="pill"><span class="pill__label" id="preposition-score-label">연속</span><span class="pill__value" id="preposition-score">0</span></div>
        <div class="pill"><span class="pill__label" id="preposition-best-label">최고</span><span class="pill__value" id="preposition-best">0</span></div>
      </div>
    </div>
    <div class="center-card preposition-question-card">
      <div class="preposition-sentence" id="preposition-sentence" aria-live="assertive"></div>
    </div>
    <div class="flash" id="preposition-flash" aria-hidden="true"></div>
    <div class="answer-feedback preposition-feedback" id="preposition-feedback" role="status" aria-live="assertive"><strong></strong><span></span></div>
  </main>

  <div class="streak-celebration" id="streak-celebration" role="status" aria-live="polite" aria-atomic="true">
    <div class="streak-celebration__message">
      <strong id="streak-celebration-score"></strong>
    </div>
    <div class="streak-celebration__particles" id="streak-celebration-particles" aria-hidden="true"></div>
  </div>

  <section class="modal" id="info-modal" role="dialog" aria-modal="true" aria-labelledby="info-title">
    <div class="modal__card">
      <p class="modal__eyebrow info">USAGE NOTE</p>
      <h2 id="info-title">기억해 두세요</h2>
      <p class="modal__message" id="info-message"></p>
      <label class="info-dismiss" for="hide-word-note">
        <input id="hide-word-note" type="checkbox">
        <span>이 단어에 대한 설명을 이 라운드 동안 띄우지 않음</span>
      </label>
      <button class="primary-button" id="info-continue" type="button">계속하기</button>
    </div>
  </section>

  <section class="modal" id="study-explanation-modal" role="dialog" aria-modal="true" aria-labelledby="study-explanation-title">
    <div class="modal__card">
      <div class="study-explanation-toolbar">
        <strong id="study-explanation-title">오답 해설</strong>
        <div class="study-explanation-actions">
          <button class="secondary-button" type="button" data-change-player aria-keyshortcuts="C">플레이어 바꾸기<kbd class="button-shortcut" aria-hidden="true">C</kbd></button>
          <button class="primary-button" type="button" data-restart-activity aria-keyshortcuts="R">다시 시작<kbd class="button-shortcut" aria-hidden="true">R</kbd></button>
        </div>
      </div>
      <div class="study-explanation-scroll">
        <div class="modal__message" id="study-explanation-message"></div>
        <button class="primary-button" id="study-explanation-continue" type="button">다음 문제</button>
      </div>
    </div>
  </section>

  <section class="modal" id="result-modal" role="dialog" aria-modal="true" aria-labelledby="result-title">
    <div class="modal__card">
      <div class="result-modal__header">
        <div class="result-player-toolbar">
          <button class="secondary-button" id="change-result-player" type="button" aria-keyshortcuts="C">플레이어 바꾸기<kbd class="button-shortcut" aria-hidden="true">C</kbd></button>
          <button class="primary-button" id="restart" type="button" aria-keyshortcuts="R">다시 시작<kbd class="button-shortcut" aria-hidden="true">R</kbd></button>
        </div>
        <p class="modal__eyebrow">ROUND OVER</p>
        <h2 id="result-title">아쉬워요!</h2>
      </div>
      <div class="result-scroll-content" id="result-scroll-content">
        <div class="modal__message" id="result-message"></div>
        <div class="stats">
          <div class="stat"><span>이번 기록</span><strong id="final-score">0</strong></div>
          <div class="stat"><span>나의 최고 기록</span><strong id="final-best">0</strong></div>
        </div>
        <div class="leaderboard">
          <div class="leaderboard__title"><h3 id="leaderboard-title">리더보드</h3></div>
          <ol class="leaderboard__list" id="leaderboard-list"></ol>
        </div>
        <div class="result-footer-actions">
          <button class="link-button" id="result-back-menu" type="button">다른 활동 고르기</button>
          <button class="link-button" id="reset-leaderboard" type="button">이 활동 리더보드 초기화</button>
        </div>
      </div>
    </div>
  </section>

  <script src="ing-data.js"></script>
  <script src="sentence-error-data.js"></script>
  <script src="to-infinitive-data.js"></script>
  <script src="sentence-building-data.js"></script>
  <script src="participle-preposition-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
